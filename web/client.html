<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBF7F1">
<meta name="robots" content="noindex, nofollow">
<!-- Icone en ligne plutot qu’un favicon.ico : elle evite une requete 404 a chaque
     ouverture de page, et un onglet sans icone se retrouve mal dans une barre chargee. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23CC785C'/><text x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23FBF7F1'>C</text></svg>">
<title>Votre espace — Claude Agency</title>
<style>
  :root {
    color-scheme: light;
    --creme:#FBF7F1; --blanc:#fff; --encre:#2B2724; --terra:#CC785C; --terra-fonce:#b96848;

    /* Gris RELUS pour le contraste. Les anciennes valeurs (#7a736c, #8c847b, #adaba3)
       donnaient 4,4 / 3,5 / 2,2 pour 1 sur le crème, la dernière servant même à du
       texte : sous les 4,5 exigés, illisible au soleil ou sur un écran fatigué.
       --gris-pale ne sert PLUS qu'aux traits et aux bordures, jamais à du texte. */
    --gris:#6b645d;        /* 5,46:1 — texte secondaire */
    --gris-clair:#726b64;  /* 4,92:1 — indications, dates */
    --gris-pale:#adaba3;   /* décor uniquement */
    --bord:#ece5db; --bord-fort:#e0d8cd;
    --alerte:#a83c22;

    /* Un canal de couleur par onglet. Ce n'est pas de la décoration : la teinte suit le
       client dans tout le panneau (titres de section, pastilles, traits), donc trois
       écrans plus bas il sait encore où il est. Deux valeurs par canal — l'encre porte
       le texte et tient les 4,5:1, la teinte vive ne touche que des traits et des
       aplats, qui n'ont besoin que de 3:1. Les confondre est ce qui rendait le libellé
       de l'onglet actif illisible (#CC785C sur crème : 3,07:1). */
    --c1:#b96848; --c1-ink:#9e4a2c; --c1-noir:#86391f; --c1-voile:#fbeae6;   /* avancement */
    --c2:#2f7a58; --c2-ink:#2a6b4d; --c2-noir:#1f5239; --c2-voile:#e6f1ea;   /* livrables  */
    --c3:#96601a; --c3-ink:#8a5410; --c3-noir:#6f430c; --c3-voile:#fbf1e0;   /* fiche      */
    /* Le quatrieme canal ne pouvait pas etre une quatrieme teinte chaude : terracotta,
       vert et ocre occupent deja ce registre, et une quatrieme ne se serait distinguee
       qu'a l'oeil pose. Ce bleu ardoise tranche des trois autres, reste sobre a cote du
       creme, et laisse la terracotta seule dire « Claude Agency ». Mesures sur #FBF7F1 :
       trait 5,12:1 (seuil 3), texte 6,93:1 (seuil 4,5). */
    --c4:#4d6a9a; --c4-ink:#3d5680; --c4-noir:#2c3f63; --c4-voile:#eaeef8;   /* analyse    */

    /* Canal courant. Chaque panneau le redéfinit ; l'en-tête et le hors-onglet
       retombent sur le canal principal. */
    --canal:var(--c1); --canal-ink:var(--c1-ink); --canal-noir:var(--c1-noir); --canal-voile:var(--c1-voile);
  }
  [data-canal="2"] { --canal:var(--c2); --canal-ink:var(--c2-ink); --canal-noir:var(--c2-noir); --canal-voile:var(--c2-voile); }
  [data-canal="3"] { --canal:var(--c3); --canal-ink:var(--c3-ink); --canal-noir:var(--c3-noir); --canal-voile:var(--c3-voile); }
  [data-canal="4"] { --canal:var(--c4); --canal-ink:var(--c4-ink); --canal-noir:var(--c4-noir); --canal-voile:var(--c4-voile); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin:0; background:var(--creme); color:var(--encre);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.55;
    -webkit-tap-highlight-color:rgba(204,120,92,.18);
  }
  .wrap { max-width:760px; margin:0 auto; padding:28px 18px calc(90px + env(safe-area-inset-bottom)); }

  /* Un seul anneau de focus pour toute la page : visible au clavier, invisible à la
     souris. Sans lui, un client qui navigue au clavier ne sait plus où il est. */
  /* L'anneau prend la couleur du panneau courant : --terra ne donnait que 3,07:1 sur
     le crème, la limite basse pour un élément d'interface. */
  :focus-visible { outline:2px solid var(--canal-ink); outline-offset:2px; border-radius:6px; }

  .kicker { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--c1-ink); font-weight:700; }
  h1 { font-size:27px; line-height:1.25; margin:6px 0 6px; text-wrap:balance; }
  .sub { color:var(--gris); font-size:15px; margin:0 0 4px; }
  .maj { color:var(--gris-clair); font-size:14px; margin:10px 0 0; font-variant-numeric:tabular-nums; }

  /* Repères d'arrivée : où en est le dossier, en une ligne, avant même de choisir un
     onglet. Un client qui revient chaque semaine veut savoir en une seconde s'il s'est
     passé quelque chose depuis sa dernière visite. Chaque repère porte la couleur de
     l'onglet qui le détaille, ce qui apprend le code couleur sans rien expliquer. */
  .reperes { display:flex; flex-wrap:wrap; gap:8px 10px; margin:14px 0 0; padding:0; list-style:none; }
  .reperes li {
    display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--gris);
    background:var(--blanc); border:1px solid var(--bord); border-radius:999px; padding:5px 13px;
    font-variant-numeric:tabular-nums;
  }
  .reperes .pt { width:7px; height:7px; border-radius:50%; background:var(--canal); flex:0 0 auto; }
  .reperes li b { color:var(--encre); font-weight:600; }
  /* Sur téléphone, trois pastilles pleine largeur repoussaient les onglets sous la ligne
     de flottaison : le client arrivait sur un résumé et ne voyait plus la navigation.
     On enlève le décor, on garde l'information — deux lignes au lieu de six. */
  @media (max-width: 560px) {
    .reperes { gap:4px 14px; margin-top:12px; }
    .reperes li { border:0; background:none; padding:0; border-radius:0; }
  }

  /* Onglets. Sur téléphone ils passent en trois colonnes de largeur égale, avec un
     libellé qui peut tenir sur deux lignes : la barre défilante essayée d’abord cachait
     le troisième onglet hors de l’écran, et rien n’indiquait qu’il fallait faire
     glisser — un client pouvait ne jamais trouver sa fiche. */
  .tabs {
    display:flex; gap:2px; margin:22px 0 26px; border-bottom:1px solid var(--bord);
  }
  .tab {
    flex:0 0 auto; appearance:none; background:none; border:0; border-bottom:2px solid transparent;
    padding:11px 14px; margin-bottom:-1px; font:inherit; font-size:15px; color:var(--gris);
    cursor:pointer; white-space:nowrap; touch-action:manipulation;
    transition:color .15s ease, border-color .15s ease;
  }
  @media (max-width: 560px) {
    /* Quatre onglets : deux colonnes sur deux lignes. En quatre colonnes, chaque libelle
       tombait sur trois lignes et la barre mangeait un tiers de l'ecran d'arrivee. */
    .tabs { display:grid; grid-template-columns:repeat(2, 1fr); gap:0; }
    .tab { width:100%; white-space:normal; padding:10px 6px; font-size:13.5px; line-height:1.3; text-align:center; }
    .tab .n { display:inline-block; margin-left:5px; }
  }
  .tab:hover { color:var(--encre); }
  /* L'onglet actif prend l'encre de SON canal : lisible (4,9:1 au minimum) là où la
     teinte vive ne l'était pas, et le soulignement rappelle la couleur du panneau. */
  .tab[aria-selected="true"] { color:var(--canal-ink); font-weight:700; border-bottom-color:var(--canal); }
  .tab .n {
    display:inline-block; min-width:20px; margin-left:7px; padding:1px 6px; border-radius:999px;
    background:var(--bord); color:var(--gris); font-size:12px; font-weight:700; vertical-align:1px;
    font-variant-numeric:tabular-nums;
  }
  .tab[aria-selected="true"] .n { background:var(--canal); color:#fff; }

  /* Titre de section : le libellé, puis un filet qui court jusqu'au bord. Remplace le
     trait vertical de 3 px posé à gauche de chaque titre — il balafrait la colonne, et
     le compte rendu injecté juste en dessous en porte déjà un pour ses propres titres :
     on lisait deux systèmes de repères concurrents sur le même écran. */
  h2.sec { font-size:12.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--canal-ink);
    font-weight:700; margin:34px 0 10px; display:flex; align-items:center; gap:13px; }
  h2.sec::after { content:""; flex:1 1 auto; height:1px; background:var(--bord); }
  h2.sec:first-child { margin-top:0; }
  .secnote { font-size:14px; color:var(--gris); margin:0 0 14px; max-width:68ch; }

  .carte { background:var(--blanc); border:1px solid var(--bord); border-radius:12px; padding:18px 20px; }
  .vide { background:var(--blanc); border:1px dashed var(--bord-fort); border-radius:12px;
    padding:26px 22px; color:var(--gris); font-size:15px; }
  .vide b { color:var(--encre); display:block; margin-bottom:6px; font-size:16px; }
  .vide p { margin:0 0 14px; }
  .vide p:last-child { margin-bottom:0; }

  /* Le compte rendu arrive déjà mis en forme par le serveur et sur le même crème que la
     page : on ne l’encadre pas une seconde fois. overflow-x le contient si un tableau
     dépasse, sans jamais faire défiler la page entière de côté. */
  .cr { overflow-x:auto; }
  .cr :is(h2) { text-wrap:balance; }

  details.ancien { border:1px solid var(--bord); border-radius:12px; background:var(--blanc); margin-bottom:8px; }
  details.ancien > summary {
    cursor:pointer; padding:13px 18px; font-size:15px; color:var(--encre); list-style:none;
    display:flex; align-items:center; gap:10px; touch-action:manipulation;
  }
  details.ancien > summary::-webkit-details-marker { display:none; }
  details.ancien > summary::before { content:"+"; color:var(--canal-ink); font-weight:700; font-size:17px; width:12px; }
  details.ancien[open] > summary::before { content:"–"; }
  details.ancien > summary:hover { color:var(--canal-ink); }
  details.ancien > .cr { border-top:1px solid var(--bord); }

  /* Replis du formulaire public. Reserver une place doit tenir en deux minutes ; le
     cadre d'intervention et le reste du brief restent a un clic, jamais en travers. */
  details.repli { border:1px solid var(--bord); border-radius:12px; background:var(--blanc); margin:14px 0 18px; }
  details.repli > summary {
    cursor:pointer; padding:14px 18px; font-size:15px; font-weight:600; color:var(--encre);
    list-style:none; display:flex; align-items:center; gap:10px; touch-action:manipulation;
  }
  details.repli > summary::-webkit-details-marker { display:none; }
  details.repli > summary::before { content:"+"; color:var(--canal-ink); font-weight:700; font-size:17px; width:12px; }
  details.repli[open] > summary::before { content:"–"; }
  details.repli > summary .compl { font-weight:400; color:var(--gris); font-size:13.5px; }
  details.repli > .dedans { padding:0 18px 16px; border-top:1px solid var(--bord); }
  details.repli > .dedans > .cadre { border:0; padding:14px 0 0; }
  details.repli > .dedans > h2.sec:first-child { margin-top:16px; }

  ul.liv { list-style:none; padding:0; margin:0 0 18px; background:var(--blanc);
    border:1px solid var(--bord); border-radius:12px; overflow:hidden; }
  ul.liv li + li { border-top:1px solid #f2ece4; }
  .dl { display:flex; width:100%; gap:12px; align-items:center; justify-content:space-between;
    background:none; border:0; text-align:left; font:inherit; color:var(--canal-ink); padding:13px 17px;
    cursor:pointer; touch-action:manipulation; transition:background .15s ease; }
  .dl:hover { background:var(--canal-voile); }
  .dl .nom { min-width:0; overflow-wrap:anywhere; display:flex; align-items:center; gap:10px; }
  /* Une flèche de téléchargement plutôt qu'un nom de fichier seul : sans elle, rien ne
     dit qu'une ligne de liste est cliquable, et le client attend un email. */
  .dl .fl { flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--canal-voile);
    color:var(--canal-ink); font-size:13px; line-height:22px; text-align:center; font-weight:700; }
  .dl:hover .fl { background:var(--canal); color:#fff; }
  .dl .quand { flex:0 0 auto; color:var(--gris-clair); font-size:13.5px; font-variant-numeric:tabular-nums; }
  .dl:disabled { opacity:.55; cursor:default; }
  /* Sur téléphone, la date à droite laissait au nom du fichier la moitié de la largeur :
     « argumentaire-formule-midi_v1.md » se cassait sur trois lignes. On empile. */
  @media (max-width: 560px) {
    .dl { flex-direction:column; align-items:stretch; gap:5px; }
    .dl .quand { padding-left:32px; }
  }

  /* Bloc « nous répondre » et messages déjà envoyés. */
  .carte label { display:block; font-weight:700; font-size:15px; margin-bottom:8px; }
  .carte .hint { color:var(--gris-clair); font-size:13.5px; margin:8px 0 14px; }
  .envoye { background:var(--blanc); border:1px solid var(--bord); border-radius:12px;
    padding:14px 18px; margin-bottom:8px; }
  .envoye .quand { font-size:13.5px; color:var(--gris-clair); font-variant-numeric:tabular-nums;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  .envoye .corps { font-size:15px; color:#3a3a36; white-space:pre-wrap; overflow-wrap:anywhere; }
  .etiq { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
    padding:2px 8px; border-radius:999px; }
  .etiq.lu { background:var(--c2-voile); color:var(--c2-ink); }
  .etiq.attente { background:#f2efe9; color:var(--gris); }

  .cadre { background:var(--blanc); border:1px solid var(--bord); border-radius:12px; padding:18px 22px; }
  .cadre ul { margin:0; padding:0; list-style:none; }
  .cadre li { font-size:14px; color:#514a43; margin:0 0 14px; line-height:1.6; padding-left:16px; position:relative;
    max-width:70ch; }
  .cadre li::before { content:""; position:absolute; left:0; top:.62em; width:5px; height:5px;
    border-radius:50%; background:var(--c3); }
  .cadre li:last-child { margin-bottom:0; }
  .cadre b { color:var(--encre); }

  .q { background:var(--blanc); border:1px solid var(--bord); border-radius:12px; padding:16px 18px; margin:10px 0;
    transition:border-color .15s ease; }
  .q:focus-within { border-color:var(--c3); }
  .q label { display:block; font-weight:700; font-size:15px; margin-bottom:2px; }
  .q.miss { border-color:#e0a48c; background:#fffaf7; }
  .q .hint { color:var(--gris-clair); font-size:13.5px; margin-bottom:9px; max-width:68ch; }
  .q.accept { margin-top:22px; }
  .q.accept label { font-weight:400; cursor:pointer; }
  .q.accept input { width:17px; height:17px; vertical-align:-3px; accent-color:var(--c3); margin-right:4px; }
  .req, .opt { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
    padding:2px 7px; border-radius:999px; margin-left:9px; vertical-align:2px; }
  /* « Obligatoire » n'est pas une erreur : le rouge d'alerte le faisait lire comme un
     problème sur une fiche encore vierge. La teinte de l'onglet suffit à le distinguer. */
  .req { background:var(--c3-voile); color:var(--c3-ink); }
  .opt { background:#f2efe9; color:var(--gris); }

  /* Avancement de la fiche : treize questions sans compteur, c'est un formulaire dont on
     ne voit pas la fin, et qu'on abandonne. La barre ne compte QUE les obligatoires —
     c'est le seul seuil qui empêche d'envoyer, et gonfler l'objectif à treize
     décourageait au lieu d'aider. */
  .avance { display:flex; align-items:center; gap:12px; margin:0 0 18px;
    font-size:14px; color:var(--gris); }
  .avance .jauge { flex:0 0 110px; height:6px; border-radius:999px;
    background:var(--bord); overflow:hidden; }
  .avance .jauge i { display:block; height:100%; width:0; border-radius:999px; background:var(--c3);
    transition:width .25s cubic-bezier(.22,1,.36,1); }
  .avance span:last-child { min-width:0; }
  /* Terminé : la couleur suffit à le dire. En gras, la phrase pesait plus lourd que la
     consigne qu'elle accompagne — un compteur ne doit pas crier plus fort que le formulaire. */
  .avance.pleine { color:var(--c2-ink); }
  .avance.pleine .jauge i { background:var(--c2); }
  textarea, input.champ { width:100%; border:1px solid var(--bord-fort); border-radius:8px; padding:10px 12px; font:inherit;
    font-size:15px; color:var(--encre); background:#fdfcfa; }
  textarea { resize:vertical; min-height:74px; }
  textarea:focus, input.champ:focus { border-color:var(--canal); background:var(--blanc); }
  /* Piège à robots. Retiré du flux, de l'écran, du parcours clavier et de l'arbre
     d'accessibilité : un humain ne le rencontre jamais, un automate le remplit.
     `display:none` seul est reconnu par les robots un peu sérieux. */
  .piege { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

  .bar { position:sticky; bottom:0; background:var(--creme); border-top:1px solid var(--bord);
    padding:14px 0 calc(16px + env(safe-area-inset-bottom)); margin-top:26px;
    display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  /* Fond sur l'encre du canal et non sur la teinte vive : blanc sur --canal donnait
     4,09:1 pour un libellé de 16 px gras, sous les 4,5 exigés. Mesuré, pas estimé. */
  button.principal { background:var(--canal-ink); color:#fff; border:0; border-radius:9px; padding:13px 26px;
    font:inherit; font-size:16px; font-weight:700; cursor:pointer; touch-action:manipulation;
    transition:background .15s ease; }
  button.principal:hover { background:var(--canal-noir); }
  button.principal:disabled { opacity:.55; cursor:default; }
  .lien { background:none; border:1px solid var(--bord-fort); border-radius:9px; padding:10px 18px;
    font:inherit; font-size:15px; color:var(--canal-ink); cursor:pointer; text-decoration:none;
    display:inline-block; touch-action:manipulation; transition:background .15s ease; }
  .lien:hover { background:var(--blanc); }

  .msg { font-size:14.5px; color:var(--gris); }
  .msg.ok { color:var(--c2-ink); font-weight:700; }
  .msg.err { color:var(--alerte); font-weight:700; }
  .note { background:var(--canal-voile); border:1px solid var(--bord-fort); border-radius:10px; padding:13px 16px;
    font-size:14px; color:#514a43; margin:0 0 16px; max-width:68ch; }
  /* Plan d'action. Une etape numerotee, son explication, et le livrable qu'elle produit.
     Le numero est dans la marge : la colonne de texte reste alignee sur le reste de la
     page, et l'oeil suit la progression sans lire les chiffres. */
  ol.etapes { list-style:none; counter-reset:et; padding:0; margin:0 0 6px; }
  ol.etapes > li { counter-increment:et; position:relative; background:var(--blanc);
    border:1px solid var(--bord); border-radius:12px; padding:15px 18px 15px 56px; margin-bottom:8px; }
  ol.etapes > li::before { content:counter(et); position:absolute; left:16px; top:15px;
    width:26px; height:26px; line-height:26px; text-align:center; border-radius:50%;
    background:var(--canal-voile); color:var(--canal-noir); font-size:13.5px; font-weight:700;
    font-variant-numeric:tabular-nums; }
  ol.etapes .quoi { display:block; font-weight:600; color:var(--encre); margin-bottom:5px; }
  ol.etapes p { margin:0; color:#514a43; font-size:15px; }
  ol.etapes .livr { display:block; margin-top:9px; font-size:14px; color:var(--gris);
    border-top:1px solid var(--bord); padding-top:8px; }
  ol.etapes .livr b { color:var(--canal-ink); font-weight:700; }
  @media (max-width: 560px) {
    ol.etapes > li { padding:14px 15px 14px 15px; }
    ol.etapes > li::before { position:static; display:inline-block; margin:0 8px 6px 0; }
  }
  /* Les trois encarts qui accompagnent un challenge : ce qu'on attend du client, ce
     qu'on regarde, ce a quoi on fait attention. Meme forme, teinte du canal en filet. */
  .bloc { background:var(--blanc); border:1px solid var(--bord); border-left:3px solid var(--canal);
    border-radius:0 12px 12px 0; padding:14px 18px; margin:0 0 10px; }
  .bloc > b { display:block; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--canal-ink); margin-bottom:8px; }
  .bloc ul { margin:0; padding-left:19px; color:#514a43; font-size:15px; }
  .bloc li + li { margin-top:5px; }
  .center { text-align:center; padding:70px 20px; color:var(--gris); }
  .aide { margin-top:32px; padding-top:18px; border-top:1px solid var(--bord); color:var(--gris); font-size:14px; }
  .aide a { color:var(--canal-ink); }

  .fait { text-align:center; padding:44px 10px 20px; }
  .fait .tick { width:62px; height:62px; line-height:62px; border-radius:50%; background:var(--c2);
    color:#fff; font-size:32px; margin:0 auto 22px; }
  .fait h2 { font-size:23px; margin:0 0 16px; text-wrap:balance; }
  .fait p { max-width:520px; margin:0 auto 14px; color:#514a43; text-wrap:pretty; }
  .fait p.petit { font-size:14px; color:var(--gris-clair); }

  /* Changement d'onglet : une apparition de 160 ms, sans déplacement. Elle dit qu'on a
     changé d'écran là où une bascule sèche laisse croire que la page a sauté.
     [hidden] reste la vérité : le panneau est visible par défaut et l'animation ne fait
     que l'accompagner — un panneau dont l'affichage dépendrait d'une transition
     resterait blanc sur un rendu sans animation. */
  [role="tabpanel"]:not([hidden]) { animation:entree .16s cubic-bezier(.22,1,.36,1) both; }
  @keyframes entree { from { opacity:0 } to { opacity:1 } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="center">Chargement…</div></div>

<script>
const FN = "https://ifutijlvjgkdaonxzzpi.supabase.co/functions/v1/clients";
const CONTACT = "contact@claudeagency.fr";
// Le jeton ouvre la fiche ET le telechargement des livrables : on le retire de la barre
// d’adresse des sa lecture, pour qu’il ne traine ni dans l’historique, ni dans une
// capture d’ecran, ni dans un Referer.
//
// Mais le retirer sans le garder nulle part rendait la page inrechargeable : un F5, ou
// un onglet restaure par le navigateur, et le client tombait sur « lien incomplet » —
// il devait retourner chercher son email. On le depose donc dans sessionStorage, qui
// vit le temps de l’onglet et disparait a sa fermeture : le rechargement fonctionne,
// sans laisser de trace durable sur un poste partage.
const CLE_JETON = "jeton_espace_client";
const PARAMS = new URLSearchParams(location.search);
// Lien d'inscription : /client?nouveau=1, communiqué aux prospects. Il ne porte aucun
// jeton et n'ouvre aucune fiche existante — il ne fait qu'écrire. On l'exige explicite
// plutôt que de déduire « pas de jeton = inscription » : un client dont le lien est
// tronqué doit lire « lien incomplet », pas se voir proposer de créer un second compte.
const MODE_INSCRIPTION = PARAMS.get("nouveau") === "1";
let TOKEN = PARAMS.get("t") || "";
try {
  if (TOKEN) sessionStorage.setItem(CLE_JETON, TOKEN);
  else if (!MODE_INSCRIPTION) TOKEN = sessionStorage.getItem(CLE_JETON) || "";
} catch(e) { /* navigation privee stricte : le jeton reste en memoire seulement */ }
// Le paramètre d'inscription reste dans l'URL : le prospect n'a pas encore de fiche à
// protéger, et un rechargement doit lui rendre son formulaire, pas « lien incomplet ».
try { if (PARAMS.get("t")) history.replaceState(null, "", location.pathname + (MODE_INSCRIPTION ? "?nouveau=1" : "") + location.hash); } catch(e){}

// Le questionnaire vit ICI et nulle part ailleurs : le libelle de chaque question est
// enregistre AVEC la reponse, donc modifier cette liste plus tard ne rend pas
// illisibles les fiches deja remplies.
// r:true = reponse obligatoire (societe, activite, challenge 1). Les autres sont
// facultatives : mieux vaut une fiche partielle envoyee qu’une fiche parfaite jamais remplie.
const QUESTIONS = [
  { s:"Votre société", q:"Votre société", h:"Nom, site web, réseaux sociaux principaux.", r:true },
  { s:"Votre société", q:"Votre activité en 2-3 phrases", h:"Que vendez-vous, et à qui ?", r:true },
  { s:"Votre société", q:"Votre client type", h:"Qui achète chez vous, quel problème vient-il résoudre, quel budget y consacre-t-il ?" },
  { s:"Votre société", q:"D’où viennent vos clients aujourd’hui", h:"Bouche-à-oreille, Google, Instagram, publicité, prescripteurs… et lequel marche le mieux ?" },
  { s:"Votre offre", q:"Vos offres et vos prix", h:"Les 1 à 3 offres sur lesquelles vous voulez que nous travaillions en priorité." },
  { s:"Votre offre", q:"Ce qui vous différencie de vos concurrents", h:"Pourquoi on vous choisit vous plutôt qu’un autre." },
  { s:"Vos challenges", q:"Challenge 1 — votre priorité", r:true,
    h:"Décrivez la mission la plus importante : ce que vous voulez obtenir, pourquoi, pour qui, ce qui existe déjà, et le résultat concret attendu d’ici un mois." },
  { s:"Vos challenges", q:"Challenge 2", h:"Une deuxième mission, si vous en avez une. Même consigne : le maximum de contexte." },
  { s:"Vos challenges", q:"Challenge 3", h:"Une troisième mission, si vous en avez une." },
  { s:"Votre contexte", q:"Ce que vous avez déjà essayé", h:"Et pourquoi ça n’a pas suffi." },
  { s:"Votre contexte", q:"Vos contraintes", h:"Budget, délais, réglementation, et surtout : ce qu’il ne faut pas faire." },
  { s:"En pratique", q:"Accès et outils", h:"Quels outils ou comptes votre interlocuteur devra utiliser (site, CRM, Drive, réseaux sociaux…)." },
  { s:"En pratique", q:"Ton de communication et validation", h:"Comment vous parlez à vos clients, qui valide les livrables et sous quel délai." }
];

// Cadre d’intervention présenté AVANT les questions et validé par une case à cocher
// obligatoire, dont la date est enregistrée en base : un avertissement que personne ne
// coche ne prouve rien. Ce texte informe et limite ; il ne remplace pas un contrat.
// Il reste dans l’onglet du questionnaire, au-dessus des questions : rangé dans un
// onglet à part, il deviendrait un onglet que le client peut ne jamais ouvrir, et une
// acceptation que personne n’a lue ne vaut pas grand-chose.
const CADRE = [
  ["Pas de données sensibles", "Ne nous transmettez ni mots de passe personnels, ni coordonnées bancaires, ni données de santé, ni fichiers contenant des données personnelles de vos propres clients. Créez-nous des accès dédiés, avec les droits strictement nécessaires, que vous pouvez retirer à tout moment."],
  ["Pas d’intervention critique sans filet", "Les missions confiées ne doivent pas porter sur des modifications lourdes de votre production : migration, refonte de base de données, système de paiement ou de facturation, infrastructure. Avant toute intervention sur un site ou un outil en service, vous devez disposer d’une sauvegarde récente et vérifiée."],
  ["Vous validez avant toute mise en ligne", "Rien n’est publié, activé ni déployé sans votre accord explicite. Ce que vous validez engage votre responsabilité."],
  ["Le travail produit avec l’IA doit être relu", "Il peut comporter des erreurs, des approximations ou des informations obsolètes. Vous le vérifiez avant publication, en particulier pour toute affirmation réglementée — santé, droit, finance — et pour tout engagement commercial ou tarifaire."],
  ["Nous nous engageons sur les moyens, pas sur les résultats", "Positionnement dans les moteurs de recherche, trafic, nombre de contacts ou chiffre d’affaires dépendent aussi de facteurs extérieurs (algorithmes, plateformes, concurrence, marché). Aucun résultat commercial n’est garanti."],
  ["Dépendance à des services tiers", "Une panne, une modification de règles ou une suspension de compte chez un prestataire tiers (hébergeur, Google, Meta, fournisseur d’IA, outil SaaS) échappe à notre contrôle et ne peut nous être imputée."],
  ["Sauvegardes et responsabilité", "Vous restez responsable de vos sauvegardes et de la continuité de votre activité. Claude Agency ne peut être tenue responsable des erreurs, pertes de données, interruptions de service, pertes d’exploitation ou préjudices indirects consécutifs aux missions demandées."],
  ["Vos droits sur ce que vous nous confiez", "Vous garantissez détenir les droits sur les éléments transmis (textes, images, marques, bases de données) et que votre activité est conforme à la réglementation qui vous concerne."],
  ["Confidentialité", "Ce que vous partagez ici n’est accessible qu’à Claude Agency et au collaborateur assigné à votre compte."]
];

// Formulaire public : reserver une place ne doit demander que le strict necessaire.
// Un engagement court pris maintenant se termine ; un formulaire parfait qu'on remet a
// « ce week-end » ne revient jamais. Le reste du brief se remplit juste apres, ou plus
// tard depuis le lien personnel. Cote espace client (avec jeton), rien ne change.
const REQUIS_INSCRIPTION = new Set(["Challenge 1 — votre priorité"]);
// Sur le formulaire public, le nom de la societe est deja demande en haut de page
// (champ d'identite). Reposer la question dans le brief donnait deux fois le meme
// champ a l'ecran. Elle reste posee dans l'espace client, ou le champ d'identite
// n'existe pas et ou le client complete site web et reseaux.
const EXCLUES_INSCRIPTION = new Set(["Votre société"]);
function questionAffichee(it){ return !(MODE_INSCRIPTION && EXCLUES_INSCRIPTION.has(it.q)); }
function estRequis(it){ return MODE_INSCRIPTION ? REQUIS_INSCRIPTION.has(it.q) : !!it.r; }
// A l'inscription, la consigne du challenge 1 est volontairement plus legere : on
// demande une intention, pas un cahier des charges.
const HINT_INSCRIPTION = {
  "Challenge 1 — votre priorité": "Une ou deux phrases suffisent : ce que vous voulez obtenir. On creusera ensemble au cadrage."
};
function hintDe(it){ return (MODE_INSCRIPTION && HINT_INSCRIPTION[it.q]) || it.h; }

const SECTION_NOTES = {
  "Vos challenges": "Un challenge = une mission que vous nous confiez. <b>Plus vous détaillez votre contexte, "
    + "vos besoins et vos contraintes, meilleur sera le résultat.</b> Une mission décrite en une ligne donne un "
    + "travail approximatif ; une mission décrite en dix lignes donne un travail utile."
};

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// T12:00:00 : sans heure, une date seule est lue en UTC et peut reculer d’un jour.
function jour(iso){ return iso ? new Date(String(iso).slice(0,10) + "T12:00:00") : null; }
const FMT_LONG = new Intl.DateTimeFormat("fr-FR", { day:"numeric", month:"long", year:"numeric" });
const FMT_COURT = new Intl.DateTimeFormat("fr-FR", { day:"2-digit", month:"2-digit", year:"numeric" });
function dateLongue(iso){ const d = jour(iso); return d ? FMT_LONG.format(d) : ""; }
function dateCourte(iso){ const d = jour(iso); return d ? FMT_COURT.format(d) : ""; }

// Le compte rendu est fabriqué par notre serveur pour un EMAIL. Il arrive donc avec sa
// propre enveloppe — fond crème, largeur fixe de 640 px — et rappelle en tête la marque,
// le nom de la société et la date. Affiché tel quel dans la page, cela donnait le nom du
// client trois fois et la date deux fois sur le même écran, dans une carte décalée par
// rapport au reste de la colonne.
// On sort donc la carte de son enveloppe, on lui rend la largeur de la colonne, et on
// retire les lignes d’en-tête que la page affiche déjà juste au-dessus.
// Défensif de bout en bout : à la moindre structure inattendue on renvoie le HTML
// d’origine, quitte à afficher un doublon plutôt que rien.
function rapportPropre(html){
  const brut = String(html || "");
  try {
    const hote = document.createElement("div");
    hote.innerHTML = brut;
    const enveloppe = hote.firstElementChild;
    const carte = enveloppe && enveloppe.firstElementChild;
    if (!carte) return brut;
    carte.style.maxWidth = "none";
    carte.style.margin = "0";
    // La carte de l'email devient une simple portion de la page. Dans un email elle est
    // seule au milieu du fond crème et son cadre la détache ; ici elle contient déjà une
    // carte par challenge, et garder son propre cadre donnait des cartes dans une carte —
    // deux cadres imbriqués sur un même écran, où le regard ne sait plus quel bloc lire.
    carte.style.border = "0";
    carte.style.borderRadius = "0";
    carte.style.background = "transparent";
    carte.style.padding = "0";
    // Au plus trois retraits : la marque, le titre, la ligne de date. On s’arrête au
    // premier élément qui n’est pas de l’en-tête, donc jamais sur du contenu.
    for (let n = 0; n < 3; n++) {
      const el = carte.firstElementChild;
      if (!el) break;
      const t = (el.textContent || "").trim().toLowerCase();
      const enTete = t === "claude agency" || /^h[1-6]$/i.test(el.tagName) || /^compte rendu du /.test(t);
      if (!enTete) break;
      el.remove();
    }
    // Ceinture et bretelles : si un titre a survécu, il ne doit pas concurrencer le
    // <h1> de la page dans la hiérarchie lue par un lecteur d’écran.
    carte.querySelectorAll("h1").forEach((h) => {
      const h2 = document.createElement("h2");
      h2.setAttribute("style", h.getAttribute("style") || "");
      h2.innerHTML = h.innerHTML;
      h.replaceWith(h2);
    });
    return carte.outerHTML;
  } catch(e) { return brut; }
}

// Brouillon local : la saisie est recopiée dans le navigateur du client à chaque frappe.
// Sans ça, un client qui remplit les questions facultatives, laisse une obligatoire vide
// et ferme son onglet perd tout — l’enregistrement serveur lui étant refusé.
// Tout est en try/catch : en navigation privée, localStorage peut lever une exception.
const DRAFT_KEY = "fiche_client_" + TOKEN.slice(0, 16);
// Le questionnaire etait protege d'une fermeture d'onglet, pas le message. Un client
// qui redige dix lignes, clique sur « Vos livrables » puis revient les perdait.
const DRAFT_MSG = "message_client_" + TOKEN.slice(0, 16);
function lireBrouillonMsg(){ try { return localStorage.getItem(DRAFT_MSG) || ""; } catch(e) { return ""; } }
function ecrireBrouillonMsg(v){ try { if (v) localStorage.setItem(DRAFT_MSG, v); else localStorage.removeItem(DRAFT_MSG); } catch(e) {} }
function readDraft(){ try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null") || null; } catch(e) { return null; } }
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch(e) {} }
function writeDraft(){
  try {
    const o = {};
    QUESTIONS.forEach((it, i) => { const el = document.getElementById("f" + i); if (el && el.value.trim()) o[it.q] = el.value; });
    if (Object.keys(o).length) localStorage.setItem(DRAFT_KEY, JSON.stringify(o)); else localStorage.removeItem(DRAFT_KEY);
  } catch(e) {}
}

// Où en est le remplissage. Ne compte QUE les questions obligatoires : ce sont les
// seules qui bloquent l'envoi, et afficher « 4 sur 13 » à un client qui a déjà tout ce
// qu'il faut pour démarrer lui donne l'impression d'être en retard alors qu'il peut
// envoyer. Les facultatives sont mentionnées à côté, sans jauge.
function majAvancement(){
  const barre = document.getElementById("jauge");
  const txt = document.getElementById("avancetxt");
  const zone = document.getElementById("avance");
  if (!barre || !txt || !zone) return;
  const valeur = (id) => { const el = document.getElementById(id); return !!(el && el.value.trim()); };
  const rempli = (i) => valeur("f" + i);
  // Sur le formulaire public, la société et l'email sont obligatoires eux aussi : les
  // exclure affichait « 0 sur 3 » à un prospect qui venait de remplir deux champs
  // marqués « obligatoire » juste au-dessus de la jauge.
  const champs = MODE_INSCRIPTION ? ["fsoc", "fmail"] : [];
  const oblig = QUESTIONS.map((it, i) => estRequis(it) ? i : -1).filter((i) => i >= 0);
  const total = oblig.length + champs.length;
  const faits = oblig.filter(rempli).length + champs.filter(valeur).length;
  barre.style.width = Math.round((faits / total) * 100) + "%";
  const complet = faits === total;
  zone.classList.toggle("pleine", complet);
  // Une ligne courte, qui tient à côté de la jauge. La version longue passait à la ligne
  // et occupait plus de place que la consigne juste au-dessus.
  txt.textContent = complet
    ? (MODE_INSCRIPTION ? "Vous pouvez envoyer votre demande." : "Vous pouvez envoyer votre fiche.")
    : faits + " sur " + total + " réponses obligatoires";
}

async function post(body){
  const r = await fetch(FN, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}

let DATA = null;
let ONGLET = "";

// ---------------------------------------------------------------- onglets
// `canal` : le numero de la couleur portee par l'onglet et par tout son panneau.
const ONGLETS = [
  { id:"avancement", titre:"Où en est votre projet", canal:1 },
  { id:"livrables",  titre:"Vos livrables",          canal:2 },
  { id:"fiche",      titre:"Votre fiche client",     canal:3 },
  // L'analyse arrive apres la fiche parce qu'elle en decoule : on lit d'abord ce qu'on
  // a dit, ensuite ce que l'agence en fait. Elle est chargee a la premiere ouverture de
  // l'onglet et pas au chargement de la page — la produire coute un appel a un modele,
  // et rien ne justifie de le payer pour un client venu telecharger un fichier.
  { id:"analyse",    titre:"Analyse client",         canal:4 }
];

// Onglet d’arrivée. Un client qui revient veut son avancement ; un client qui découvre
// la page n’a encore rien à y lire et doit d’abord remplir sa fiche. Le fragment
// d’URL prime : il permet de revenir sur le même onglet après un rechargement.
function ongletParDefaut(data){
  const voulu = (location.hash || "").replace(/^#/, "");
  if (ONGLETS.some(o => o.id === voulu)) return voulu;
  return (data.reports && data.reports.length) ? "avancement" : "fiche";
}

function setOnglet(id, deplacerLeFocus){
  if (!ONGLETS.some(o => o.id === id)) return;
  ONGLET = id;
  ONGLETS.forEach(o => {
    const bouton = document.getElementById("t-" + o.id);
    const panneau = document.getElementById("p-" + o.id);
    const actif = o.id === id;
    if (bouton) { bouton.setAttribute("aria-selected", actif ? "true" : "false"); bouton.tabIndex = actif ? 0 : -1; }
    if (panneau) panneau.hidden = !actif;
  });
  // replaceState et non pushState : le bouton « retour » du navigateur doit ramener le
  // client d’où il vient, pas lui faire remonter un à un les onglets qu’il a ouverts.
  try { history.replaceState(null, "", location.pathname + "#" + id); } catch(e){}
  if (deplacerLeFocus) { const b = document.getElementById("t-" + id); if (b) b.focus(); }
  // Chargement paresseux : le plan n'est demande qu'a la premiere ouverture de son
  // onglet. Un client venu telecharger un livrable ne declenche aucun appel de modele.
  if (id === "analyse") chargerAnalyse(false);
}

function clavierOnglets(e){
  const i = ONGLETS.findIndex(o => o.id === ONGLET);
  let j = -1;
  if (e.key === "ArrowRight") j = (i + 1) % ONGLETS.length;
  else if (e.key === "ArrowLeft") j = (i - 1 + ONGLETS.length) % ONGLETS.length;
  else if (e.key === "Home") j = 0;
  else if (e.key === "End") j = ONGLETS.length - 1;
  if (j < 0) return;
  e.preventDefault();
  setOnglet(ONGLETS[j].id, true);
}

function barreOnglets(data){
  const n = (data.files || []).length;
  return '<div class="tabs" role="tablist" aria-label="Sections de votre espace">'
    + ONGLETS.map(o =>
        '<button type="button" class="tab" role="tab" id="t-' + o.id + '" data-canal="' + o.canal + '"'
        + ' aria-controls="p-' + o.id + '" aria-selected="false" tabindex="-1">'
        + esc(o.titre)
        + (o.id === "livrables" && n ? '<span class="n">' + esc(n) + '</span>' : '')
        + '</button>').join("")
    + '</div>';
}

// Repères d'arrivée. On n'affiche que ce qui existe : sur un dossier qui démarre, une
// ligne de « — » partout dirait au client qu'il est en retard alors qu'il vient
// d'arriver. Chaque repère prend la couleur de l'onglet qui le détaille.
function reperes(data){
  const items = [];
  const dernier = (data.reports || [])[0];
  if (dernier) items.push([1, 'Dernier point le <b>' + esc(dateCourte(dernier.date)) + '</b>']);
  const n = (data.files || []).length;
  if (n) items.push([2, '<b>' + esc(n) + '</b> livrable' + (n > 1 ? 's' : '') + ' à télécharger']);
  if (data.answered_at) items.push([3, 'Fiche envoyée le <b>' + esc(dateCourte(data.answered_at)) + '</b>']);
  if (!items.length) return "";
  return '<ul class="reperes">'
    + items.map(([c, t]) => '<li data-canal="' + c + '"><span class="pt" aria-hidden="true"></span>' + t + '</li>').join("")
    + '</ul>';
}

// ---------------------------------------------------------------- panneau : avancement
function panneauAvancement(data){
  const rapports = Array.isArray(data.reports) ? data.reports : [];
  let h = "";
  if (!rapports.length) {
    const fiche = (data.answers || []).length;
    h += '<div class="vide"><b>Votre projet vient de démarrer.</b>'
      + '<p>Dès que nous aurons avancé sur vos challenges, votre interlocuteur vous transmettra '
      + 'un point écrit : ce qui a été fait, ce qui reste à faire, et ce que nous attendons de vous. '
      + 'Il s’affichera ici, et vous le recevrez aussi par email.</p>'
      + (fiche ? '' : '<p><button type="button" class="lien" data-vers="fiche">Commencer par remplir ma fiche</button></p>')
      + '</div>';
  } else {
    const dernier = rapports[0];
    h += '<h2 class="sec">Le point du ' + esc(dateLongue(dernier.date)) + '</h2>'
       + '<div class="secnote">Transmis par votre interlocuteur. Vous l’avez également reçu par email.</div>'
       + '<div class="cr">' + rapportPropre(dernier.html) + '</div>';

    const anciens = rapports.slice(1);
    if (anciens.length) {
      h += '<h2 class="sec">Les points précédents</h2>'
         + '<div class="secnote">Ouvrez un point pour relire où en était le projet à cette date.</div>'
         + anciens.map(r =>
             '<details class="ancien"><summary>Point du ' + esc(dateLongue(r.date)) + '</summary>'
             + '<div class="cr">' + rapportPropre(r.html) + '</div></details>').join("");
      const total = Number(data.reports_total || rapports.length);
      if (total > rapports.length) {
        h += '<div class="secnote" style="margin-top:12px">Seuls les ' + esc(rapports.length)
           + ' points les plus récents sont affichés, sur ' + esc(total) + ' au total.</div>';
      }
    }
  }
  return h + blocReponse(data) + aideContact("Une autre question ?");
}

// Le compte rendu demande régulièrement quelque chose au client — un accès, une
// validation, un arbitrage — et jusqu’ici il n’avait aucun moyen de répondre sans
// changer d’outil. Le formulaire est dans cet onglet, sous le point auquel il répond.
function blocReponse(data){
  const msgs = Array.isArray(data.messages) ? data.messages : [];
  let h = '<h2 class="sec">Nous répondre</h2>'
    + '<div class="secnote">Un accès à transmettre, une validation à donner, une précision à apporter ? '
    + 'Écrivez-nous ici : votre interlocuteur reçoit votre message tout de suite.</div>'
    + '<div class="carte">'
    + '<label for="rep">Votre message</label>'
    + '<textarea id="rep" name="reponse" rows="4" maxlength="3000" autocomplete="off" aria-describedby="repaide">'
    + esc(lireBrouillonMsg()) + '</textarea>'
    + '<div class="hint" id="repaide">3000 caractères au maximum. Pour un fichier volumineux, '
    + 'indiquez-nous plutôt un lien de téléchargement.</div>'
    + '<button type="button" class="principal" id="envoyer">Envoyer mon message</button> '
    + '<span class="msg" id="repmsg" aria-live="polite"></span>'
    + '</div>';
  if (msgs.length) {
    h += '<h2 class="sec">Vos messages</h2>'
       + '<div class="secnote">Ce que vous nous avez déjà écrit depuis cette page.</div>'
       + msgs.map(m =>
           '<div class="envoye"><div class="quand">Envoyé le ' + esc(dateCourte(m.created_at))
           + (m.lu ? '<span class="etiq lu">lu</span>' : '<span class="etiq attente">non lu</span>')
           + '</div><div class="corps">' + esc(m.body) + '</div></div>').join("");
  }
  return h;
}

async function envoyerMessage(){
  const t = document.getElementById("rep");
  const bouton = document.getElementById("envoyer");
  const m = document.getElementById("repmsg");
  const corps = t.value.trim();
  if (corps.length < 2) {
    m.className = "msg err";
    m.textContent = "Écrivez quelques mots avant d’envoyer.";
    t.focus();
    return;
  }
  bouton.disabled = true;
  m.className = "msg";
  m.textContent = "Envoi…";
  try {
    await post({ action:"message", token:TOKEN, body:corps });
    ecrireBrouillonMsg("");   // parti chez l'agence : le brouillon n'a plus de raison d'etre
    // On ajoute le message en mémoire plutôt que de recharger toute la page : le client
    // voit sa réponse apparaître tout de suite, sans perdre sa place ni son onglet.
    DATA.messages = [{ body: corps, created_at: new Date().toISOString(), lu: false }]
      .concat(Array.isArray(DATA.messages) ? DATA.messages : []);
    document.getElementById("p-avancement").innerHTML = panneauAvancement(DATA);
    brancherAvancement();
    const m2 = document.getElementById("repmsg");
    m2.className = "msg ok";
    m2.textContent = "Message envoyé. Votre interlocuteur en est averti.";
  } catch(e) {
    m.className = "msg err";
    // Le serveur renvoie deja un texte lisible (message vide, plafond journalier
    // atteint) : on le montre tel quel plutôt qu’un code d’erreur.
    m.textContent = e.message + ". Votre texte est toujours à l’écran.";
    bouton.disabled = false;
  }
}

// Rebranche ce qui vit dans l’onglet avancement. Appelée au premier rendu, et après
// l’envoi d’un message qui reconstruit le panneau.
function brancherAvancement(){
  const b = document.getElementById("envoyer");
  if (b) b.addEventListener("click", envoyerMessage);
  const t = document.getElementById("rep");
  if (t) t.addEventListener("input", () => ecrireBrouillonMsg(t.value.trim()));
  document.querySelectorAll('[data-vers]').forEach(x =>
    x.addEventListener("click", () => setOnglet(x.dataset.vers, true)));
}

function aideContact(intro){
  const sujet = encodeURIComponent((DATA && DATA.company ? DATA.company + " — " : "") + "question sur mon suivi");
  return '<div class="aide">' + esc(intro) + ' '
    + '<a href="mailto:' + CONTACT + '?subject=' + sujet + '">Écrivez à votre interlocuteur</a>, '
    + 'ou répondez simplement à l’email que vous avez reçu.</div>';
}

// ---------------------------------------------------------------- panneau : livrables
function panneauLivrables(data){
  const fs = Array.isArray(data.files) ? data.files : [];
  if (!fs.length) {
    return '<div class="vide"><b>Aucun livrable pour le moment.</b>'
      + '<p>Les fichiers que nous produisons pour vous apparaissent ici dès qu’ils vous sont '
      + 'transmis avec un point d’avancement. Vous pourrez les télécharger à tout moment '
      + 'depuis cette page.</p></div>';
  }
  // Groupés par challenge : un client suit ses missions, pas une arborescence de fichiers.
  const parChallenge = new Map();
  fs.forEach(f => {
    const k = Number(f.challenge || 0);
    if (!parChallenge.has(k)) parChallenge.set(k, []);
    parChallenge.get(k).push(f);
  });
  const cles = Array.from(parChallenge.keys()).sort((a, b) => a - b);
  let h = '<div class="secnote">Cliquez sur un fichier pour le télécharger. Ils restent disponibles ici '
        + 'aussi longtemps que votre projet est suivi.</div>';
  cles.forEach(k => {
    h += '<h2 class="sec">' + (k ? 'Challenge ' + esc(k) : 'Documents généraux') + '</h2>'
      + '<ul class="liv">'
      + parChallenge.get(k).map(f =>
          '<li><button type="button" class="dl" data-i="' + esc(String(f.i)) + '">'
          + '<span class="nom"><span class="fl" aria-hidden="true">↓</span>'
          + '<span class="txt">' + esc(f.file) + '</span></span>'
          + '<span class="quand">' + (f.date ? 'transmis le ' + esc(dateCourte(f.date)) : '') + '</span>'
          + '</button></li>').join("")
      + '</ul>';
  });
  return h + '<div class="msg" id="dlmsg" aria-live="polite"></div>' + aideContact("Un fichier ne s’ouvre pas ?");
}

// ---------------------------------------------------------------- panneau : analyse
// Le plan d'action que l'agence tire de la fiche. Il est VISIBLE PAR LE CLIENT : la
// consigne donnee au modele (fonction `clients`, action `analysis`) lui interdit les
// noms de collaborateurs, les estimations de charge et les promesses chiffrees. Ce qui
// s'affiche ici doit pouvoir etre lu par les deux cotes de la table.
let ANALYSE = null;      // dernier etat connu, pour ne pas rappeler le serveur a chaque bascule
let ANALYSE_ENCOURS = false;

function listeBloc(titre, items){
  if (!items || !items.length) return "";
  return '<div class="bloc"><b>' + esc(titre) + '</b><ul>'
       + items.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul></div>';
}

function planHtml(a, at, perimee){
  let h = "";
  if (perimee) {
    h += '<div class="note">Votre fiche a changé depuis cette analyse. Nous la mettons à jour ; '
       + 'ce que vous lisez ci-dessous reste la version précédente.</div>';
  }
  if (a.comprehension) {
    h += '<h2 class="sec">Ce que nous avons compris</h2>'
       + '<div class="carte">' + esc(a.comprehension) + '</div>';
  }
  if (a.premiere_semaine && a.premiere_semaine.length) {
    h += '<h2 class="sec">Les premiers jours</h2>'
       + '<div class="secnote">Ce par quoi nous commençons, dans cet ordre.</div>'
       + '<ol class="etapes">' + a.premiere_semaine.map(x =>
           '<li><p>' + esc(x) + '</p></li>').join("") + '</ol>';
  }
  (a.challenges || []).forEach(ch => {
    h += '<h2 class="sec">Challenge ' + esc(ch.numero) + (ch.titre ? ' — ' + esc(ch.titre) : '') + '</h2>';
    if (ch.objectif) h += '<div class="secnote">' + esc(ch.objectif) + '</div>';
    if (ch.etapes && ch.etapes.length) {
      h += '<ol class="etapes">' + ch.etapes.map(e =>
          '<li>' + (e.titre ? '<span class="quoi">' + esc(e.titre) + '</span>' : '')
        + (e.detail ? '<p>' + esc(e.detail) + '</p>' : '')
        + (e.livrable ? '<span class="livr"><b>Livrable</b> · ' + esc(e.livrable) + '</span>' : '')
        + '</li>').join("") + '</ol>';
    }
    h += listeBloc("Ce dont nous avons besoin de vous", ch.besoins)
       + listeBloc("Comment nous verrons que ça avance", ch.indicateurs)
       + listeBloc("Points de vigilance", ch.vigilance);
  });
  if (a.questions && a.questions.length) {
    h += '<h2 class="sec">Ce qu’il nous reste à préciser avec vous</h2>'
       + '<div class="secnote">Nous vous poserons ces questions au cadrage. Vous pouvez aussi '
       + 'y répondre dès maintenant depuis « Où en est votre projet ».</div>'
       + '<ul class="liv" style="list-style:disc;padding:14px 18px 14px 36px">'
       + a.questions.map(q => '<li>' + esc(q) + '</li>').join("") + '</ul>';
  }
  // Le cadre d'intervention dit que le travail produit avec l'IA doit etre relu. Le
  // dire ici aussi, a l'endroit ou le client lit justement un texte produit ainsi.
  h += '<div class="aide">Plan établi le ' + esc(dateCourte(at)) + ' à partir de votre fiche, '
     + 'avec l’aide de l’IA puis relu par votre interlocuteur. Il évoluera au cadrage : '
     + 'c’est une base de discussion, pas un engagement de résultat.</div>';
  return h;
}

function panneauAnalyse(data){
  const fiche = (data.answers || []).some(a => /challenge\s*1/i.test(a.q) && a.a);
  if (!fiche) {
    return '<div class="vide"><b>Décrivez d’abord vos challenges.</b>'
      + '<p>Dès que votre fiche décrit au moins une mission, nous en tirons un plan d’action '
      + 'détaillé : les étapes, ce que chacune produit, et ce dont nous avons besoin de vous.</p>'
      + '<p><button type="button" class="lien" data-vers="fiche">Aller à ma fiche</button></p></div>';
  }
  return '<div id="zoneanalyse"><div class="center">Chargement…</div></div>';
}

// Trois etats, et un seul appel serveur par etat : disponible, a produire, indisponible.
// Le premier appel ne genere rien — il dit ce qui existe. C'est ce qui permet d'afficher
// tout de suite un plan deja calcule, et un ecran d'attente honnete quand il faut le
// fabriquer (une minute environ, le temps d'un modele).
async function chargerAnalyse(force){
  const zone = document.getElementById("zoneanalyse");
  if (!zone || ANALYSE_ENCOURS) return;
  if (ANALYSE && !force) return;
  ANALYSE_ENCOURS = true;
  try {
    let d = await post({ action:"analysis", token:TOKEN });
    if (!d.pret && !d.vide) {
      zone.innerHTML = '<div class="vide"><b>Nous préparons votre plan d’action.</b>'
        + '<p>Nous relisons votre fiche et en tirons les étapes de chaque mission. '
        + 'Comptez une minute — vous pouvez laisser cette page ouverte.</p></div>';
      d = await post({ action:"analysis", token:TOKEN, generer:true });
    }
    if (d.vide) { zone.innerHTML = '<div class="vide"><b>Rien à analyser pour l’instant.</b>'
        + '<p>Décrivez au moins une mission dans votre fiche.</p></div>'; ANALYSE = null; return; }
    if (d.pret && d.analysis) { ANALYSE = d; zone.innerHTML = planHtml(d.analysis, d.at, false); return; }
    if (d.analysis) { ANALYSE = d; zone.innerHTML = planHtml(d.analysis, d.at, true); return; }
    // Une generation est deja en cours ailleurs (le serveur l'a lancee a l'envoi de la
    // fiche). On ne la double pas : on laisse la main au client plutot que de tourner.
    if (d.encours) {
      zone.innerHTML = '<div class="vide"><b>Votre plan d’action est en cours de préparation.</b>'
        + '<p>Il sera prêt d’ici une minute ou deux.</p>'
        + '<p><button type="button" class="lien" id="reanalyse">Actualiser</button></p></div>';
      const r = document.getElementById("reanalyse");
      if (r) r.addEventListener("click", () => { ANALYSE = null; chargerAnalyse(true); });
      return;
    }
    throw new Error("indisponible");
  } catch(e) {
    zone.innerHTML = '<div class="vide"><b>Le plan d’action n’a pas pu être affiché.</b>'
      + '<p>' + esc(e.message) + '</p>'
      + '<p><button type="button" class="lien" id="reanalyse">Réessayer</button></p></div>';
    const b = document.getElementById("reanalyse");
    if (b) b.addEventListener("click", () => { ANALYSE = null; chargerAnalyse(true); });
  } finally { ANALYSE_ENCOURS = false; }
}

// ---------------------------------------------------------------- panneau : fiche
function panneauFiche(data){
  const prev = {};
  (data.answers || []).forEach(a => { prev[a.q] = a.a; });
  // Le formulaire public ne pose PAS la question « Votre société » : le nom est saisi
  // dans le champ d'identite et vit dans `clients.company`, pas dans les reponses. Sans
  // cette reprise, le prospect qui revenait sur son espace trouvait une question
  // obligatoire vide, une jauge a « 2 sur 3 », et surtout un enregistrement refuse tant
  // qu'il n'avait pas retape le nom que nous connaissons deja.
  if (!MODE_INSCRIPTION && !String(prev["Votre société"] || "").trim() && data.company) {
    prev["Votre société"] = data.company;
  }
  const draft = readDraft();
  let restaure = false;
  if (draft) {
    Object.keys(draft).forEach(q => { if ((prev[q] || "") !== draft[q]) { prev[q] = draft[q]; restaure = true; } });
  }

  let h = MODE_INSCRIPTION
    ? '<div class="secnote">Trois champs et une phrase suffisent pour réserver votre place. '
      + 'Vous recevrez aussitôt par email <b>votre lien personnel</b> : c’est là que vous compléterez '
      + 'le brief, tranquillement, et que vous suivrez l’avancement.</div>'
      // Identité du prospect. Ces trois champs n'existent que sur le formulaire public :
      // pour un client déjà créé, ils sont dans la fiche du tableau de bord et ne sont
      // pas à lui.
      + '<div class="q" id="qsoc"><label for="fsoc">Votre société<span class="req">obligatoire</span></label>'
      + '<div class="hint" id="hsoc">Le nom sous lequel nous vous suivrons.</div>'
      + '<input class="champ" id="fsoc" name="societe" type="text" autocomplete="organization" aria-describedby="hsoc" maxlength="120"></div>'
      + '<div class="q" id="qnom"><label for="fnom">Votre nom<span class="opt">facultatif</span></label>'
      + '<div class="hint" id="hnom">Pour savoir à qui nous nous adressons.</div>'
      + '<input class="champ" id="fnom" name="contact" type="text" autocomplete="name" aria-describedby="hnom" maxlength="120"></div>'
      + '<div class="q" id="qmail"><label for="fmail">Votre email professionnel<span class="req">obligatoire</span></label>'
      + '<div class="hint" id="hmail">C’est là que part votre lien personnel, et là que vous recevrez vos points d’avancement.</div>'
      + '<input class="champ" id="fmail" name="email" type="email" inputmode="email" autocomplete="email" aria-describedby="hmail" maxlength="160"></div>'
      // Piège à robots : masqué à l'écran ET au lecteur d'écran, hors du parcours clavier.
      // Un automate remplit tout ce qu'il trouve ; le serveur ignore l'envoi si c'est rempli.
      + '<div class="piege" aria-hidden="true"><label for="fsite">Ne remplissez pas ce champ</label>'
      + '<input id="fsite" name="site" type="text" tabindex="-1" autocomplete="off"></div>'
    : '<div class="secnote">Ces réponses servent à votre interlocuteur pour démarrer vite '
      + 'et dans la bonne direction. Trois questions sont obligatoires, les autres sont facultatives — '
      + 'vous pouvez revenir compléter plus tard avec ce même lien.</div>';
  if (data.answered_at) {
    h += '<div class="note">Fiche envoyée le ' + esc(dateCourte(data.answered_at)) + '. Vous pouvez la modifier et la renvoyer.</div>';
  }
  if (restaure) {
    h += '<div class="note">Nous avons retrouvé une saisie non envoyée sur cet appareil : elle est réaffichée '
       + 'ci-dessous. Pensez à enregistrer pour nous la transmettre.</div>';
  }
  // Après l'état de la fiche, avant le cadre : le client sait d'abord où il en est, et
  // seulement ensuite ce qu'il lui reste à lire.
  h += '<div class="avance" id="avance"><span class="jauge" aria-hidden="true"><i id="jauge"></i></span>'
     + '<span id="avancetxt" role="status"></span></div>';
  // Une question, son libelle et sa zone de saisie. Extrait pour etre pose au meme
  // endroit qu'on l'affiche a plat ou dans un repli : deux versions du meme HTML
  // auraient divergé au premier ajout de question.
  const champQ = (it, i) =>
    '<div class="q" id="q' + i + '"><label for="f' + i + '">' + esc(it.q)
    + (estRequis(it) ? '<span class="req">obligatoire</span>' : '<span class="opt">facultatif</span>') + '</label>'
    + '<div class="hint" id="h' + i + '">' + esc(hintDe(it)) + '</div>'
    + '<textarea id="f' + i + '" name="q' + i + '" aria-describedby="h' + i + '" autocomplete="off" rows="3">'
    + esc(prev[it.q] || "") + '</textarea></div>';

  const blocCadre = '<div class="cadre"><ul>'
    + CADRE.map(c => '<li><b>' + esc(c[0]) + '.</b> ' + esc(c[1]) + '</li>').join('')
    + '</ul></div>';

  if (MODE_INSCRIPTION) {
    // 1. Ce qui bloque la reservation, a plat.
    QUESTIONS.forEach((it, i) => { if (estRequis(it) && questionAffichee(it)) h += champQ(it, i); });

    // 2. Le reste du brief, replie. Rien n'est perdu pour celui qui veut tout dire
    //    maintenant ; rien n'est impose a celui qui veut juste reserver.
    let inner = "", sec2 = "";
    QUESTIONS.forEach((it, i) => {
      if (estRequis(it) || !questionAffichee(it)) return;
      if (it.s !== sec2) {
        sec2 = it.s;
        inner += '<h2 class="sec">' + esc(sec2) + '</h2>';
        if (SECTION_NOTES[sec2]) inner += '<div class="secnote">' + SECTION_NOTES[sec2] + '</div>';
      }
      inner += champQ(it, i);
    });
    h += '<details class="repli"><summary>Compléter le brief maintenant '
       + '<span class="compl">facultatif, environ 5 minutes</span></summary>'
       + '<div class="dedans"><div class="secnote" style="margin-top:14px">Rien n’est obligatoire ici. '
       + 'Plus vous en dites, plus votre interlocuteur démarre dans la bonne direction — mais vous pourrez '
       + 'aussi tout compléter plus tard depuis votre lien personnel.</div>' + inner + '</div></details>';

    // 3. Le cadre d'intervention, replie lui aussi mais juste au-dessus de la case :
    //    on ne le cache pas, on arrete de l'imposer avant meme d'avoir dit bonjour.
    h += '<details class="repli"><summary>Le cadre de nos interventions '
       + '<span class="compl">à lire avant d’accepter</span></summary>'
       + '<div class="dedans">' + blocCadre + '</div></details>';
  } else {
    h += '<h2 class="sec">Le cadre de nos interventions</h2>'
       + '<div class="secnote">À lire avant de décrire vos missions. Ce cadre protège votre activité autant que la nôtre.</div>'
       + blocCadre;

    let sec = "";
    QUESTIONS.forEach((it, i) => {
      if (it.s !== sec) {
        sec = it.s;
        h += '<h2 class="sec">' + esc(sec) + '</h2>';
        if (SECTION_NOTES[sec]) h += '<div class="secnote">' + SECTION_NOTES[sec] + '</div>';
      }
      h += champQ(it, i);
    });
  }
  h += '<div class="q accept" id="qaccept"><label for="accept">'
     + '<input type="checkbox" id="accept"' + (data.terms_accepted_at ? ' checked' : '') + '> '
     + '<b>J’ai lu et j’accepte le cadre d’intervention</b> décrit ' + (MODE_INSCRIPTION ? 'ci-dessus' : 'en haut de cet onglet') + '.'
     + '<span class="req">obligatoire</span></label>'
     + (data.terms_accepted_at ? '<div class="hint" style="margin:8px 0 0">Accepté le '
         + esc(dateCourte(data.terms_accepted_at)) + '.</div>' : '')
     + '</div>';
  h += '<div class="bar"><button type="button" class="principal" id="go">'
     + (MODE_INSCRIPTION ? 'Réserver ma place' : 'Enregistrer ma fiche') + '</button>'
     + '<span class="msg" id="msg" aria-live="polite"></span></div>';
  return h;
}

// ---------------------------------------------------------------- inscription
// Le formulaire public réutilise EXACTEMENT le panneau de la fiche : mêmes questions,
// même cadre d'intervention, mêmes couleurs, même jauge. Une seconde page aurait fait
// deux questionnaires à maintenir, et ils auraient divergé au premier ajout de question.
function renderInscription(){
  DATA = { answers: [], reports: [], files: [], messages: [] };
  document.getElementById("wrap").innerHTML =
    '<header><div class="kicker" translate="no">Claude Agency</div>'
    + '<h1>Réservez votre place</h1>'
    + '<p class="sub">Deux minutes suffisent pour réserver. Le reste peut attendre.</p></header>'
    + '<main data-canal="3"><section id="p-fiche">' + panneauFiche(DATA) + '</section></main>';

  document.getElementById("go").addEventListener("click", save);
  QUESTIONS.forEach((it, i) => { const el = document.getElementById("f" + i);
    if (el) el.addEventListener("input", () => { writeDraft(); majAvancement(); }); });
  // La société et l'email comptent dans la jauge : sans ces deux écouteurs, elle reste
  // à zéro pendant que le prospect remplit les deux premiers champs de la page.
  ["fsoc", "fmail"].forEach((id) => document.getElementById(id).addEventListener("input", majAvancement));
  majAvancement();
}

// ---------------------------------------------------------------- rendu
function render(data){
  DATA = data;
  const dernier = (data.reports && data.reports[0]) ? data.reports[0].date : null;

  let h = '<header><div class="kicker" translate="no">Claude Agency</div>'
        + '<h1>' + esc(data.company || "Votre espace") + '</h1>'
        + '<p class="sub">Cette page vous est réservée : seul votre lien personnel y donne accès.</p>'
        + reperes(data)
        + '</header>';
  h += barreOnglets(data);
  h += '<main>'
     + '<section role="tabpanel" data-canal="1" id="p-avancement" aria-labelledby="t-avancement" tabindex="0" hidden>' + panneauAvancement(data) + '</section>'
     + '<section role="tabpanel" data-canal="2" id="p-livrables"  aria-labelledby="t-livrables"  tabindex="0" hidden>' + panneauLivrables(data) + '</section>'
     + '<section role="tabpanel" data-canal="3" id="p-fiche"      aria-labelledby="t-fiche"      tabindex="0" hidden>' + panneauFiche(data) + '</section>'
     + '<section role="tabpanel" data-canal="4" id="p-analyse"    aria-labelledby="t-analyse"    tabindex="0" hidden>' + panneauAnalyse(data) + '</section>'
     + '</main>';

  document.getElementById("wrap").innerHTML = h;

  ONGLETS.forEach(o => {
    const b = document.getElementById("t-" + o.id);
    b.addEventListener("click", () => setOnglet(o.id, false));
    b.addEventListener("keydown", clavierOnglets);
  });
  document.getElementById("go").addEventListener("click", save);
  QUESTIONS.forEach((it, i) => { const el = document.getElementById("f" + i);
    if (el) el.addEventListener("input", () => { writeDraft(); majAvancement(); }); });
  majAvancement();
  brancherAvancement();
  brancherTelechargements();

  setOnglet(ongletParDefaut(data), false);
}

// La réponse de « download » est le fichier lui-même, pas du JSON : on n’utilise donc
// pas post(). Le jeton part dans le corps de la requête, jamais dans l’URL.
function brancherTelechargements(){
  document.querySelectorAll(".dl").forEach(btn => {
    btn.addEventListener("click", async () => {
      const m = document.getElementById("dlmsg");
      // .txt et non .nom : .nom porte aussi la flèche, et ce nom est comparé au fichier
      // par le serveur — le lui envoyer avec un « ↓ » collé devant ferait refuser tous
      // les téléchargements (409).
      const nom = btn.querySelector(".txt").textContent;
      btn.disabled = true;
      if (m) { m.className = "msg"; m.textContent = "Téléchargement de " + nom + "…"; }
      try {
        const r = await fetch(FN, { method:"POST", headers:{"Content-Type":"application/json"},
          // Le nom part avec l'indice : le serveur refuse si la liste a bouge entre
          // l'affichage de la page et le clic, plutot que de servir un autre fichier.
          body: JSON.stringify({ action:"download", token:TOKEN, i:Number(btn.dataset.i), file:nom }) });
        if (!r.ok) {
          let d = null; try { d = await r.json(); } catch(e) {}
          throw new Error((d && d.error) || "indisponible");
        }
        const u = URL.createObjectURL(await r.blob());
        const a = document.createElement("a");
        a.href = u; a.download = nom;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(u), 10000);
        if (m) m.textContent = "";
      } catch(e) {
        if (m) { m.className = "msg err"; m.textContent = "Ce fichier n’a pas pu être téléchargé (" + e.message + "). Réessayez, ou signalez-le à votre interlocuteur."; }
      }
      btn.disabled = false;
    });
  });
}

async function save(){
  const btn = document.getElementById("go"), m = document.getElementById("msg");
  // Un champ absent du DOM (question retiree du formulaire public) vaut reponse vide :
  // l'index reste aligne sur QUESTIONS, et le serveur accepte les fiches partielles.
  const answers = QUESTIONS.map((it, i) => { const el = document.getElementById("f" + i);
    return { q: it.q, a: el ? el.value.trim() : "" }; });

  // Identité, sur le formulaire public uniquement. Vérifiée ici pour que le prospect
  // corrige sur place ; le serveur revérifie de toute façon — une page peut être modifiée.
  if (MODE_INSCRIPTION) {
    const soc = document.getElementById("fsoc"), mail = document.getElementById("fmail");
    const mauvais = [];
    if (!soc.value.trim()) mauvais.push(["qsoc", soc, "Indiquez le nom de votre société."]);
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim())) mauvais.push(["qmail", mail, "Cette adresse email n’est pas valide."]);
    document.getElementById("qsoc").classList.toggle("miss", !soc.value.trim());
    document.getElementById("qmail").classList.toggle("miss", !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim()));
    if (mauvais.length) {
      m.className = "msg err";
      m.textContent = mauvais[0][2];
      mauvais[0][1].focus();
      document.getElementById(mauvais[0][0]).scrollIntoView({ behavior:"smooth", block:"center" });
      return;
    }
  }
  // Les 3 questions obligatoires sont verifiees ici, avant l’envoi : le serveur accepte
  // les fiches partielles a dessein (le client peut enregistrer, revenir, completer).
  const manque = QUESTIONS.map((it, i) => (estRequis(it) && !answers[i].a) ? i : -1).filter((i) => i >= 0);
  QUESTIONS.forEach((it, i) => { const bloc = document.getElementById("q" + i);
    if (bloc) bloc.classList.toggle("miss", manque.includes(i)); });
  if (manque.length) {
    m.className = "msg err";
    m.textContent = manque.length === 1
      ? "Une question obligatoire est encore vide : complétez-la puis réessayez."
      : manque.length + " questions obligatoires sont encore vides : complétez-les puis réessayez.";
    // Une question obligatoire peut vivre dans un repli : le focus sur un champ ferme
    // ne montre rien. On ouvre le repli avant de deplacer le regard.
    const cible = document.getElementById("q" + manque[0]);
    const repli = cible && cible.closest ? cible.closest("details") : null;
    if (repli) repli.open = true;
    document.getElementById("f" + manque[0]).focus();
    cible.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  const accepte = document.getElementById("accept").checked;
  document.getElementById("qaccept").classList.toggle("miss", !accepte);
  if (!accepte) {
    m.className = "msg err";
    m.textContent = "Cochez la case d’acceptation du cadre d’intervention pour envoyer votre fiche.";
    document.getElementById("accept").focus();
    document.getElementById("qaccept").scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  btn.disabled = true; m.className = "msg";
  m.textContent = MODE_INSCRIPTION ? "Envoi…" : "Enregistrement…";
  try {
    if (MODE_INSCRIPTION) {
      const d = await post({ action:"signup", answers, terms_accepted:true,
        company: document.getElementById("fsoc").value.trim(),
        contact_name: document.getElementById("fnom").value.trim(),
        contact_email: document.getElementById("fmail").value.trim(),
        site: document.getElementById("fsite").value });
      clearDraft();
      confirmationInscription(d);
      return;
    }
    await post({ action:"submit", token:TOKEN, answers, terms_accepted:true });
    clearDraft(); // le serveur a la version definitive : le brouillon n’a plus de raison d’etre
    DATA = Object.assign({}, DATA || {}, { answers: answers, answered_at: new Date().toISOString(),
      terms_accepted_at: DATA && DATA.terms_accepted_at ? DATA.terms_accepted_at : new Date().toISOString() });
    confirmation();
    return;
  } catch(e) {
    m.className = "msg err";
    m.textContent = (MODE_INSCRIPTION ? "L’envoi a échoué (" : "L’enregistrement a échoué (") + e.message
      + "). Vos réponses sont toujours à l’écran : réessayez dans un instant.";
  }
  btn.disabled = false;
}

// Confirmation d'inscription. Elle dit ce qui se passe MAINTENANT, parce que c'est la
// seule chose que le prospect ne peut pas deviner : son lien part par email, et c'est
// la seule porte vers son espace. `mailed` vient du verdict Mailjet, pas d'un code 200 :
// promettre un email qui n'est jamais parti est la pire façon de commencer.
function confirmationInscription(d){
  const existant = d && d.existant;
  const parti = !d || d.mailed !== false;
  document.getElementById("wrap").innerHTML =
    '<main data-canal="2"><div class="fait"><div class="tick" aria-hidden="true">✓</div>'
    + '<h2>' + (existant ? 'Vous êtes déjà suivi par Claude Agency.' : 'Merci, votre demande est enregistrée.') + '</h2>'
    + (parti
        ? '<p>Nous venons de vous envoyer <b>votre lien personnel</b> par email. Gardez-le : c’est par '
          + 'lui que vous suivrez l’avancement de votre projet, que vous téléchargerez vos livrables '
          + 'et que vous pourrez nous répondre.</p>'
          + '<p class="petit">Si vous ne le voyez pas d’ici quelques minutes, regardez dans vos courriers '
          + 'indésirables avant de nous écrire.</p>'
        : '<p>Votre demande est bien enregistrée, mais <b>l’email contenant votre lien personnel n’a pas pu '
          + 'partir</b>. Écrivez-nous à <a href="mailto:' + CONTACT + '">' + CONTACT + '</a> et nous vous '
          + 'le transmettrons directement.</p>')
    + (existant ? '' : '<p class="petit">Un membre de l’équipe revient vers vous avec un plan d’action adapté '
        + 'à ce que vous venez de décrire.</p>')
    + '</div></main>';
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// La confirmation remplace le contenu de l’onglet, pas la page : les onglets restent
// accessibles, et le client peut enchaîner sur son avancement sans recharger.
function confirmation(){
  const p = document.getElementById("p-fiche");
  p.innerHTML = '<div class="fait"><div class="tick" aria-hidden="true">✓</div>'
    + '<h2>Merci, votre fiche est enregistrée.</h2>'
    + '<p>Un membre de l’équipe Claude Agency va revenir vers vous dans les meilleurs délais '
    + 'pour vous proposer un plan d’action adapté aux objectifs et aux contraintes que vous venez de décrire.</p>'
    + '<p class="petit">Ce lien reste valable : revenez quand vous le souhaitez pour compléter vos réponses '
    + 'ou suivre l’avancement de votre projet.</p>'
    + '<p><button type="button" class="lien" id="revoir">Revoir mes réponses</button></p></div>';
  p.scrollIntoView({ behavior:"smooth", block:"start" });
  document.getElementById("revoir").addEventListener("click", () => { render(DATA); setOnglet("fiche", true); });
}

(async () => {
  if (MODE_INSCRIPTION) { renderInscription(); return; }
  if (!TOKEN) {
    document.getElementById("wrap").innerHTML =
      '<div class="center">Ce lien est incomplet.<br>Ouvrez le lien exact reçu par email, '
      + 'ou écrivez à <a href="mailto:' + CONTACT + '">' + CONTACT + '</a>.</div>';
    return;
  }
  try {
    render(await post({ action:"form", token:TOKEN }));
  } catch(e) {
    document.getElementById("wrap").innerHTML =
      '<div class="center">Ce lien n’est plus valide.<br>Écrivez à '
      + '<a href="mailto:' + CONTACT + '">' + CONTACT + '</a> pour en recevoir un nouveau.</div>';
  }
})();
</script>
