<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBF7F1">
<meta name="robots" content="noindex, nofollow">
<!-- Icone en ligne plutot qu’un favicon.ico : elle evite une requete 404 a chaque
     ouverture de page, et un onglet sans icone se retrouve mal dans une barre chargee. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23CC785C'/><text x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23FBF7F1'>C</text></svg>">
<title>Votre espace — Claude Agency</title>
<style>
  :root {
    color-scheme: light;
    --creme:#FBF7F1; --blanc:#fff; --encre:#2B2724; --terra:#CC785C; --terra-fonce:#b96848;

    /* Gris RELUS pour le contraste. Les anciennes valeurs (#7a736c, #8c847b, #adaba3)
       donnaient 4,4 / 3,5 / 2,2 pour 1 sur le crème, la dernière servant même à du
       texte : sous les 4,5 exigés, illisible au soleil ou sur un écran fatigué.
       --gris-pale ne sert PLUS qu'aux traits et aux bordures, jamais à du texte. */
    --gris:#6b645d;        /* 5,46:1 — texte secondaire */
    --gris-clair:#726b64;  /* 4,92:1 — indications, dates */
    --gris-pale:#adaba3;   /* décor uniquement */
    --bord:#ece5db; --bord-fort:#e0d8cd;
    --alerte:#a83c22; --alerte-voile:#fdeeea;

    /* Un canal de couleur par onglet. Ce n'est pas de la décoration : la teinte suit le
       client dans tout le panneau (titres de section, pastilles, traits), donc trois
       écrans plus bas il sait encore où il est. Deux valeurs par canal — l'encre porte
       le texte et tient les 4,5:1, la teinte vive ne touche que des traits et des
       aplats, qui n'ont besoin que de 3:1. Les confondre est ce qui rendait le libellé
       de l'onglet actif illisible (#CC785C sur crème : 3,07:1). */
    --c1:#b96848; --c1-ink:#9e4a2c; --c1-noir:#86391f; --c1-voile:#fbeae6;   /* avancement */
    --c2:#2f7a58; --c2-ink:#2a6b4d; --c2-noir:#1f5239; --c2-voile:#e6f1ea;   /* livrables  */
    --c3:#96601a; --c3-ink:#8a5410; --c3-noir:#6f430c; --c3-voile:#fbf1e0;   /* fiche      */
    /* Le quatrieme canal ne pouvait pas etre une quatrieme teinte chaude : terracotta,
       vert et ocre occupent deja ce registre, et une quatrieme ne se serait distinguee
       qu'a l'oeil pose. Ce bleu ardoise tranche des trois autres, reste sobre a cote du
       creme, et laisse la terracotta seule dire « Claude Agency ». Mesures sur #FBF7F1 :
       trait 5,12:1 (seuil 3), texte 6,93:1 (seuil 4,5). */
    --c4:#4d6a9a; --c4-ink:#3d5680; --c4-noir:#2c3f63; --c4-voile:#eaeef8;   /* analyse    */

    /* Teintes des CHALLENGES — mauve, bleu, jaune (choix de Julien, 05/08/2026).
       Distinctes des quatre canaux ci-dessus, et c'est le point : `--cN` dit dans quel
       ONGLET on se trouve, `--chN` de quelle MISSION on parle. Les confondre, comme
       c'etait le cas jusqu'ici, obligeait a repeindre les onglets pour recolorer un
       challenge. Meme discipline que les canaux : `-ink` porte le texte (4,5:1), la
       teinte vive ne touche que traits et aplats (3:1), `-noir` sert sur le voile.
       Le jaune n'existe pas en texte lisible : `--ch3-ink` est l'ambre fonce qu'il faut
       pour tenir 4,5:1, le jaune vrai reste sur le voile et les traits. */
    /* Les voiles violet et bleu ont ete ECARTES l'un de l'autre : a #f3ecfa / #e6eefb
       ils n'etaient qu'a 5,2 d'ecart perceptuel (dE), la ou les autres paires du triplet
       sont a 25. Deux fonds pastel de meme clarte donnent un rapport de contraste de
       1,0 tout en etant distincts : le test de contraste ne pouvait donc pas voir ce
       defaut-la. Mesure a part, en Lab. A 9,7 les deux se separent sans se crier dessus. */
    --ch1:#8a63b8; --ch1-ink:#6b4596; --ch1-noir:#533472; --ch1-voile:#f5e8fd;  /* violet */
    /* Le bleu a ete SOUTENU une seconde fois, pour une raison qui n'apparait que dans
       l'onglet Analyse : la ce sont les challenges ET le canal 4 (bleu ardoise) qui
       cohabitent, et a #e0eefe le voile du challenge 2 n'etait qu'a 4,5 dE du voile de
       l'onglet. Deux bleus pales voisins sur le meme ecran. A #cfe8fd il est a 9,4 de
       l'onglet et 13,1 du violet — le triplet reste separe des deux cotes. */
    --ch2:#3a6fb8; --ch2-ink:#2f5c99; --ch2-noir:#234674; --ch2-voile:#cfe8fd;  /* bleu   */
    /* Le voile ambre a du etre SOUTENU : a #fdf3d9 il rendait 1,04:1 contre le creme de
       la page, c'est-a-dire qu'il ne s'en detachait pas — un fond de section qui se
       confond avec le fond ne separe plus rien, et c'etait tout l'objet de la demande.
       Mesure, pas jugee a l'oeil : sur l'ecran il paraissait distinct. */
    --ch3:#9a7410; --ch3-ink:#7d5f08; --ch3-noir:#614a06; --ch3-voile:#fbebc9;  /* ambre */

    /* Canal courant. Chaque panneau le redéfinit ; l'en-tête et le hors-onglet
       retombent sur le canal principal. */
    --canal:var(--c1); --canal-ink:var(--c1-ink); --canal-noir:var(--c1-noir); --canal-voile:var(--c1-voile);
  }
  [data-canal="2"] { --canal:var(--c2); --canal-ink:var(--c2-ink); --canal-noir:var(--c2-noir); --canal-voile:var(--c2-voile); }
  [data-canal="3"] { --canal:var(--c3); --canal-ink:var(--c3-ink); --canal-noir:var(--c3-noir); --canal-voile:var(--c3-voile); }
  [data-canal="4"] { --canal:var(--c4); --canal-ink:var(--c4-ink); --canal-noir:var(--c4-noir); --canal-voile:var(--c4-voile); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin:0; background:var(--creme); color:var(--encre);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.55;
    -webkit-tap-highlight-color:rgba(204,120,92,.18);
  }
  .wrap { max-width:760px; margin:0 auto; padding:28px 18px calc(90px + env(safe-area-inset-bottom)); }

  /* Un seul anneau de focus pour toute la page : visible au clavier, invisible à la
     souris. Sans lui, un client qui navigue au clavier ne sait plus où il est. */
  /* L'anneau prend la couleur du panneau courant : --terra ne donnait que 3,07:1 sur
     le crème, la limite basse pour un élément d'interface. */
  :focus-visible { outline:2px solid var(--canal-ink); outline-offset:2px; border-radius:6px; }

  .kicker { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--c1-ink); font-weight:700; }
  h1 { font-size:27px; line-height:1.25; margin:6px 0 6px; text-wrap:balance; }
  .sub { color:var(--gris); font-size:15px; margin:0 0 4px; }
  .maj { color:var(--gris-clair); font-size:14px; margin:10px 0 0; font-variant-numeric:tabular-nums; }

  /* Repères d'arrivée : où en est le dossier, en une ligne, avant même de choisir un
     onglet. Un client qui revient chaque semaine veut savoir en une seconde s'il s'est
     passé quelque chose depuis sa dernière visite. Chaque repère porte la couleur de
     l'onglet qui le détaille, ce qui apprend le code couleur sans rien expliquer. */
  .reperes { display:flex; flex-wrap:wrap; gap:8px 10px; margin:14px 0 0; padding:0; list-style:none; }
  .reperes li {
    display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--gris);
    background:var(--blanc); border:1px solid var(--bord); border-radius:999px; padding:5px 13px;
    font-variant-numeric:tabular-nums;
  }
  .reperes .pt { width:7px; height:7px; border-radius:50%; background:var(--canal); flex:0 0 auto; }
  .reperes li b { color:var(--encre); font-weight:600; }
  /* Sur téléphone, les pastilles pleine largeur repoussaient les onglets sous la ligne
     de flottaison : le client arrivait sur un résumé et ne voyait plus la navigation.
     On enlève le décor, on garde l'information — deux lignes au lieu de six. */
  @media (max-width: 560px) {
    .reperes { gap:4px 14px; margin-top:12px; }
    .reperes li { border:0; background:none; padding:0; border-radius:0; }
  }

  /* Onglets. Sur téléphone ils passent en trois colonnes de largeur égale, avec un
     libellé qui peut tenir sur deux lignes : la barre défilante essayée d’abord cachait
     le troisième onglet hors de l’écran, et rien n’indiquait qu’il fallait faire
     glisser — un client pouvait ne jamais trouver sa fiche. */
  /* Les trois onglets portent CHACUN la couleur de son panneau, en permanence et pas
     seulement une fois ouverts : le libellé est déjà dans l'encre du canal, et un filet
     de couleur pleine court sous chaque onglet. Le client a donc la légende des trois
     univers sous les yeux avant même d'avoir cliqué.
     L'onglet OUVERT ne se signale pas par la couleur — trois couleurs vives, aucune ne
     ressort — mais par trois marques cumulées : fond teinté, graisse, filet épaissi.
     Jamais la couleur seule : un daltonien doit voir où il est (WCAG 1.4.1). */
  .tabs {
    display:flex; gap:4px; margin:22px 0 26px; border-bottom:1px solid var(--bord);
  }
  .tab {
    flex:0 0 auto; appearance:none; background:none; border:0; position:relative;
    padding:10px 15px 12px; margin-bottom:-1px; border-radius:9px 9px 0 0;
    font:inherit; font-size:15px; font-weight:600; color:var(--canal-ink);
    cursor:pointer; white-space:nowrap; touch-action:manipulation;
    transition:background .15s ease, color .15s ease;
  }
  .tab::after {
    content:""; position:absolute; left:7px; right:7px; bottom:0; height:2px;
    border-radius:2px 2px 0 0; background:var(--canal);
    transition:height .15s ease, left .15s ease, right .15s ease;
  }
  .tab:focus-visible { outline:2px solid var(--canal-noir); outline-offset:-3px; }
  @media (max-width: 560px) {
    /* Deux colonnes : en trois, chaque libelle tombait sur trois lignes et la barre
       mangeait un tiers de l'ecran d'arrivee. Le dernier onglet prend la ligne entiere
       plutot que la moitie — une demi-case vide se lit comme un onglet manquant. */
    .tabs { display:grid; grid-template-columns:repeat(2, 1fr); gap:5px; }
    .tab:last-child { grid-column:1 / -1; }
    .tab { width:100%; white-space:normal; padding:10px 6px 12px; font-size:13.5px; line-height:1.3; text-align:center; }
    .tab::after { left:5px; right:5px; }
    .tab .n { display:inline-block; margin-left:5px; }
  }
  .tab:hover { background:var(--canal-voile); }
  /* L'onglet ouvert : fond teinté + graisse + filet plein largeur et plus épais. L'encre
     passe au ton le plus sombre du canal, qui tient 6,9:1 au minimum sur ce fond. */
  .tab[aria-selected="true"] { background:var(--canal-voile); color:var(--canal-noir); font-weight:700; }
  .tab[aria-selected="true"]::after { left:0; right:0; height:3px; }
  .tab .n {
    display:inline-block; min-width:20px; margin-left:7px; padding:1px 6px; border-radius:999px;
    background:var(--canal-voile); color:var(--canal-noir); font-size:12px; font-weight:700; vertical-align:1px;
    font-variant-numeric:tabular-nums;
  }
  /* Fond en --canal-noir et non en --canal : blanc sur la terracotta pleine ne fait que
     4,09:1. Aucun compteur ne vit sur cet onglet aujourd'hui, mais la règle est commune
     aux quatre — la corriger ici coûte moins qu'un piège posé pour plus tard. */
  .tab[aria-selected="true"] .n { background:var(--canal-noir); color:#fff; }

  /* Titre de section : le libellé, puis un filet qui court jusqu'au bord. Remplace le
     trait vertical de 3 px posé à gauche de chaque titre — il balafrait la colonne, et
     le compte rendu injecté juste en dessous en porte déjà un pour ses propres titres :
     on lisait deux systèmes de repères concurrents sur le même écran. */
  h2.sec { font-size:12.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--canal-ink);
    font-weight:700; margin:34px 0 10px; display:flex; align-items:center; gap:13px; }
  h2.sec::after { content:""; flex:1 1 auto; height:1px; background:var(--bord); }
  h2.sec:first-child { margin-top:0; }
  .secnote { font-size:14px; color:var(--gris); margin:0 0 14px; max-width:68ch; }

  .vide { background:var(--blanc); border:1px dashed var(--bord-fort); border-radius:12px;
    padding:26px 22px; color:var(--gris); font-size:15px; }
  .vide b { color:var(--encre); display:block; margin-bottom:6px; font-size:16px; }
  .vide p { margin:0 0 14px; }
  .vide p:last-child { margin-bottom:0; }

  /* Replis du formulaire public. Reserver une place doit tenir en deux minutes ; le
     cadre d'intervention et le reste du brief restent a un clic, jamais en travers. */
  details.repli { border:1px solid var(--bord); border-radius:12px; background:var(--blanc); margin:14px 0 18px; }
  details.repli > summary {
    cursor:pointer; padding:14px 18px; font-size:15px; font-weight:600; color:var(--encre);
    list-style:none; display:flex; align-items:center; gap:10px; touch-action:manipulation;
  }
  details.repli > summary::-webkit-details-marker { display:none; }
  details.repli > summary::before { content:"+"; color:var(--canal-ink); font-weight:700; font-size:17px; width:12px; }
  details.repli[open] > summary::before { content:"–"; }
  details.repli > summary .compl { font-weight:400; color:var(--gris); font-size:13.5px; }
  details.repli > .dedans { padding:0 18px 16px; border-top:1px solid var(--bord); }
  details.repli > .dedans > .cadre { border:0; padding:14px 0 0; }
  details.repli > .dedans > h2.sec:first-child { margin-top:16px; }

  /* Un fond par challenge dans « Vos livrables ». Trois missions se suivaient sur un même
     écran, séparées par un titre en petites capitales : rien ne disait où l'une finissait.
     Le fond porte la frontière, le titre n'a plus à la porter seul.
     Mêmes trois teintes et même mécanisme que l'onglet Analyse — un challenge garde donc
     sa couleur d'un onglet à l'autre, et les couleurs déjà mesurées sur le crème servent
     deux fois au lieu d'ouvrir une seconde palette.
     Une seule déclaration d'élévation : le fond, sans bordure ni ombre. Les listes de
     fichiers restent blanches par-dessus, ce qui suffit à les détacher. */
  .livch { background:var(--canal-voile); border-radius:14px; padding:17px 17px 3px; margin:0 0 14px; }
  .livch > :last-child { margin-bottom:0; }
  .livch h2.sec { margin-top:0; }
  /* Le filet du titre prend la teinte du challenge : en gris il disparaissait sur le
     voile, et l'en-tête perdait sa ligne de fermeture. */
  .livch h2.sec::after { background:var(--canal); opacity:.4; }
  /* Sur le voile, la note tertiaire quitte --gris-clair pour --gris : mesurée à 4,50:1
     sur le voile 1, elle tenait le seuil AA au centième près, et la moindre retouche de
     teinte l'aurait fait passer dessous. La hiérarchie ne perd rien — elle est portée par
     la taille (13 px contre 14) et par la largeur de bloc, pas par ces deux nuances. */
  .livch .auditnote { color:var(--gris); }
  @media (max-width:560px) { .livch { padding:14px 13px 2px; border-radius:12px; } }
  ul.liv { list-style:none; padding:0; margin:0 0 18px; background:var(--blanc);
    border:1px solid var(--bord); border-radius:12px; overflow:hidden; }
  ul.liv li + li { border-top:1px solid #f2ece4; }
  .dl { display:flex; width:100%; gap:12px; align-items:center; justify-content:space-between;
    background:none; border:0; text-align:left; font:inherit; color:var(--canal-ink); padding:13px 17px;
    cursor:pointer; touch-action:manipulation; transition:background .15s ease; }
  .dl:hover { background:var(--canal-voile); }
  .dl .nom { min-width:0; overflow-wrap:anywhere; display:flex; align-items:center; gap:10px; }
  /* Une flèche de téléchargement plutôt qu'un nom de fichier seul : sans elle, rien ne
     dit qu'une ligne de liste est cliquable, et le client attend un email. */
  .dl .fl { flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--canal-voile);
    color:var(--canal-ink); font-size:13px; line-height:22px; text-align:center; font-weight:700; }
  .dl:hover .fl { background:var(--canal); color:#fff; }
  .dl .quand { flex:0 0 auto; color:var(--gris-clair); font-size:13.5px; font-variant-numeric:tabular-nums; }
  /* « en cours de production » n'est pas une date : il ne doit pas se lire comme telle,
     sinon le client croit tenir un livrable fini. */
  .dl .quand .encours { color:var(--c1-ink); font-weight:600; font-variant-numeric:normal;
    background:var(--c1-voile); border-radius:20px; padding:2px 10px; white-space:nowrap; }
  /* « terminé » prend la teinte des livrables (canal 2) et non celle de « en cours »
     (canal 1) : les deux états sont exclusifs et doivent se distinguer au premier coup
     d'œil, sans lire le mot. */
  .dl .quand .fini { color:var(--c2-noir); font-weight:600; font-variant-numeric:normal;
    background:var(--c2-voile); border-radius:20px; padding:2px 10px; white-space:nowrap; }
  .dl:disabled { opacity:.55; cursor:default; }
  /* Versions précédentes d'un fichier, repliées sous lui. La liste répond d'abord à
     « qu'a-t-on produit pour moi » : dépliées, trois lignes d'historique par fichier
     enterraient les livrables eux-mêmes. Le décalage à gauche les rattache à leur
     fichier sans ajouter ni cadre ni filet. */
  .vers { border-top:1px solid #f2ece4; }
  .vers > summary { cursor:pointer; list-style:none; padding:9px 17px 9px 49px;
    font-size:13.5px; color:var(--gris); }
  .vers > summary::-webkit-details-marker { display:none; }
  .vers > summary::before { content:"▸ "; color:var(--canal-ink); }
  .vers[open] > summary::before { content:"▾ "; }
  .vers > summary:hover { background:var(--canal-voile); }
  .vers ul { list-style:none; padding:0; margin:0; }
  .vers .dl { padding:9px 17px 9px 49px; font-size:13.5px; color:var(--gris); }
  /* Sur téléphone, la date à droite laissait au nom du fichier la moitié de la largeur :
     « argumentaire-formule-midi_v1.md » se cassait sur trois lignes. On empile. */
  @media (max-width: 560px) {
    .dl { flex-direction:column; align-items:stretch; gap:5px; }
    .dl .quand { padding-left:32px; }
  }

  /* Audit interne d'un challenge — MANAGER SEUL. Volontairement hors de la palette des
     canaux : ce bloc ne doit jamais se confondre avec ce que le client lit. Trait
     pointillé, encre sobre, aucune teinte chaude — il se lit comme une annotation posée
     par-dessus la page, pas comme une section de la page. */
  .audit { margin:6px 0 26px; padding:12px 0 0; border-top:1px dashed var(--bord-fort); }
  .auditgo { font:inherit; font-size:14px; font-weight:600; color:var(--encre); cursor:pointer;
    background:var(--blanc); border:1px solid var(--bord-fort); border-radius:8px; padding:8px 14px;
    touch-action:manipulation; transition:background .15s ease, border-color .15s ease; }
  .auditgo:hover:not(:disabled) { background:#f4f1ea; border-color:var(--gris-pale); }
  .auditgo:disabled { opacity:.55; cursor:default; }
  .auditnote { font-size:13px; color:var(--gris-clair); margin-top:7px; max-width:68ch; }
  .auditout:not(:empty) { margin-top:14px; display:grid; gap:12px; }
  .revmsg { background:var(--blanc); border:1px solid var(--bord); border-radius:10px; overflow:hidden; }
  .revtete { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14.5px;
    color:var(--encre); padding:13px 16px; }
  .revtete b { overflow-wrap:anywhere; }
  .revcopy { margin-left:auto; font:inherit; font-size:13px; color:var(--encre); cursor:pointer;
    background:none; border:1px solid var(--bord-fort); border-radius:6px; padding:4px 11px; }
  .revcopy:hover { background:#f4f1ea; }
  /* ---- L'en-tête de note. Elle a quitté le corps du message le 04/08/2026 : le modèle
     l'écrivait dans sa phrase d'ouverture, donc elle partait dans l'email du
     collaborateur, alors qu'elle est destinée au manager seul. Ici elle est lue d'un
     coup d'œil et ne peut plus être copiée par mégarde. */
  .revscore { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 16px; background:var(--canal-voile); border-top:1px solid var(--bord); }
  .revchiffre { font-size:30px; font-weight:800; line-height:1; color:var(--canal-noir);
    font-variant-numeric:tabular-nums; }
  .revchiffre span { font-size:15px; font-weight:600; color:var(--canal-ink); }
  .revseuil { font-size:13px; color:var(--gris); }
  .revseuil b { color:var(--canal-noir); font-variant-numeric:tabular-nums; }
  /* La jauge dit en un regard « loin » ou « presque » — ce qu'un nombre nu ne dit pas.
     Le repère d'envoi est un trait sur la jauge, pas une seconde valeur à lire. */
  /* Fond en --bord, comme la jauge d'avancement de la fiche, et non en --gris-pale :
     celui-ci est un gris moyen réservé aux bordures, et la teinte du canal n'y tenait
     que 2,26:1 — la barre disparaissait dans son propre rail (mesuré, pas jugé à l'œil). */
  .revjauge { flex:1 1 160px; min-width:120px; height:7px; border-radius:4px;
    background:var(--bord); position:relative; overflow:hidden; }
  .revjauge i { position:absolute; inset:0 auto 0 0; border-radius:4px; background:var(--canal); }
  .revjauge u { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--canal-noir); }
  .revfichier { font-size:13px; color:var(--gris); overflow-wrap:anywhere; }
  /* ---- Le corps du message, en sections. Elles remplacent un pavé de texte unique que
     le serveur coupait à 2000 caractères, en plein milieu d'une phrase. */
  .revtexte { padding:14px 16px 16px; border-top:1px solid var(--bord);
    font-size:15px; line-height:1.7; color:var(--encre); }
  .revtexte p { margin:0 0 12px; }
  .revtexte p:last-child { margin-bottom:0; }
  .revtexte strong { font-weight:700; }
  .revtitre { font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--canal-ink); margin:18px 0 9px; }
  .revtitre:first-child { margin-top:0; }
  /* « À garder » : la consigne la plus vite oubliée, et celle qui coûte le plus cher —
     sans elle le collaborateur refait tout et casse ce qui marchait. D'où le filet. */
  .revgarder { border-left:3px solid var(--canal); background:var(--canal-voile);
    border-radius:0 8px 8px 0; padding:10px 13px; margin:0 0 4px; font-size:14.5px; }
  /* Une correction par ligne, numérotée : c'est la liste que le manager parcourt avant
     d'envoyer, elle doit se compter d'un coup d'œil. */
  .revcorr { margin:0; padding:0; list-style:none; display:grid; gap:11px; counter-reset:c; }
  .revcorr li { display:grid; grid-template-columns:auto 1fr; gap:11px; align-items:start; }
  .revcorr li::before { counter-increment:c; content:counter(c);
    font-size:12px; font-weight:700; line-height:20px; width:20px; height:20px; text-align:center;
    border-radius:50%; background:var(--canal-voile); color:var(--canal-noir); }
  /* L'action et sa raison sur la même ligne, la raison en gris : elle tient en une
     demi-phrase et doit se lire d'un trait, pas s'annoncer comme une seconde consigne. */
  .revcorr b { font-weight:700; display:inline; }
  .revcorr span span { color:var(--gris); font-size:14.5px; }
  /* État d'un challenge : encart sobre sous ses livrables. Teinte du canal des livrables
     une fois clôturé, neutre tant qu'il ne l'est pas — la couleur dit l'état avant que
     le mot ne soit lu. */
  .etatch { margin:12px 0 4px; padding:12px 14px; border:1px solid var(--bord);
    border-radius:10px; background:var(--blanc); display:grid; gap:5px; justify-items:start; }
  .etatch.fini { border-color:var(--c2); background:var(--c2-voile); }
  .etatch b { font-size:14.5px; color:var(--encre); }
  .etatch.fini b { color:var(--c2-noir); }
  .etatch span { font-size:13.5px; color:var(--gris); max-width:68ch; }
  .etatgo { margin-top:5px; font:inherit; font-size:14px; font-weight:600; cursor:pointer;
    color:var(--blanc); background:var(--c2-noir); border:1px solid var(--c2-noir);
    border-radius:8px; padding:8px 15px; }
  .etatgo:hover:not(:disabled) { background:var(--c2-ink); border-color:var(--c2-ink); }
  .etatgo:disabled { opacity:.55; cursor:default; }
  .revnotes { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .revnote { font-size:13px; color:var(--gris); background:#f4f1ea; border-radius:20px; padding:3px 11px;
    overflow-wrap:anywhere; }
  .revnote b { color:var(--encre); font-variant-numeric:tabular-nums; }
  .revpuces { margin:0 0 12px; padding-left:20px; display:grid; gap:8px; }
  .revpuces:last-child { margin-bottom:0; }
  /* Chemin de dépôt dans le diagnostic d'audit : à lire caractère par caractère, donc
     chasse fixe, et coupable n'importe où — un chemin long ne doit pas élargir la page. */
  .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12.5px;
    color:var(--gris); overflow-wrap:anywhere; }

  .cadre { background:var(--blanc); border:1px solid var(--bord); border-radius:12px; padding:18px 22px; }
  .cadre ul { margin:0; padding:0; list-style:none; }
  .cadre li { font-size:14px; color:#514a43; margin:0 0 14px; line-height:1.6; padding-left:16px; position:relative;
    max-width:70ch; }
  .cadre li::before { content:""; position:absolute; left:0; top:.62em; width:5px; height:5px;
    border-radius:50%; background:var(--c3); }
  .cadre li:last-child { margin-bottom:0; }
  .cadre b { color:var(--encre); }

  .q { background:var(--blanc); border:1px solid var(--bord); border-radius:12px; padding:16px 18px; margin:10px 0;
    transition:border-color .15s ease; }
  .q:focus-within { border-color:var(--c3); }
  .q label { display:block; font-weight:700; font-size:15px; margin-bottom:2px; }
  .q.miss { border-color:#e0a48c; background:#fffaf7; }
  .q .hint { color:var(--gris-clair); font-size:13.5px; margin-bottom:9px; max-width:68ch; }
  .q.accept { margin-top:22px; }
  .q.accept label { font-weight:400; cursor:pointer; }
  .q.accept input { width:17px; height:17px; vertical-align:-3px; accent-color:var(--c3); margin-right:4px; }
  .req, .opt { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
    padding:2px 7px; border-radius:999px; margin-left:9px; vertical-align:2px; }
  /* « Obligatoire » n'est pas une erreur : le rouge d'alerte le faisait lire comme un
     problème sur une fiche encore vierge. La teinte de l'onglet suffit à le distinguer. */
  .req { background:var(--c3-voile); color:var(--c3-ink); }
  .opt { background:#f2efe9; color:var(--gris); }

  /* Avancement de la fiche : treize questions sans compteur, c'est un formulaire dont on
     ne voit pas la fin, et qu'on abandonne. La barre ne compte QUE les obligatoires —
     c'est le seul seuil qui empêche d'envoyer, et gonfler l'objectif à treize
     décourageait au lieu d'aider. */
  .avance { display:flex; align-items:center; gap:12px; margin:0 0 18px;
    font-size:14px; color:var(--gris); }
  .avance .jauge { flex:0 0 110px; height:6px; border-radius:999px;
    background:var(--bord); overflow:hidden; }
  .avance .jauge i { display:block; height:100%; width:0; border-radius:999px; background:var(--c3);
    transition:width .25s cubic-bezier(.22,1,.36,1); }
  .avance span:last-child { min-width:0; }
  /* Terminé : la couleur suffit à le dire. En gras, la phrase pesait plus lourd que la
     consigne qu'elle accompagne — un compteur ne doit pas crier plus fort que le formulaire. */
  .avance.pleine { color:var(--c2-ink); }
  .avance.pleine .jauge i { background:var(--c2); }
  textarea, input.champ { width:100%; border:1px solid var(--bord-fort); border-radius:8px; padding:10px 12px; font:inherit;
    font-size:15px; color:var(--encre); background:#fdfcfa; }
  textarea { resize:vertical; min-height:74px; }
  textarea:focus, input.champ:focus { border-color:var(--canal); background:var(--blanc); }
  /* Piège à robots. Retiré du flux, de l'écran, du parcours clavier et de l'arbre
     d'accessibilité : un humain ne le rencontre jamais, un automate le remplit.
     `display:none` seul est reconnu par les robots un peu sérieux. */
  .piege { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

  .bar { position:sticky; bottom:0; background:var(--creme); border-top:1px solid var(--bord);
    padding:14px 0 calc(16px + env(safe-area-inset-bottom)); margin-top:26px;
    display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  /* Fond sur l'encre du canal et non sur la teinte vive : blanc sur --canal donnait
     4,09:1 pour un libellé de 16 px gras, sous les 4,5 exigés. Mesuré, pas estimé. */
  button.principal { background:var(--canal-ink); color:#fff; border:0; border-radius:9px; padding:13px 26px;
    font:inherit; font-size:16px; font-weight:700; cursor:pointer; touch-action:manipulation;
    transition:background .15s ease; }
  button.principal:hover { background:var(--canal-noir); }
  button.principal:disabled { opacity:.55; cursor:default; }
  .lien { background:none; border:1px solid var(--bord-fort); border-radius:9px; padding:10px 18px;
    font:inherit; font-size:15px; color:var(--canal-ink); cursor:pointer; text-decoration:none;
    display:inline-block; touch-action:manipulation; transition:background .15s ease; }
  .lien:hover { background:var(--blanc); }

  .msg { font-size:14.5px; color:var(--gris); }
  .msg.ok { color:var(--c2-ink); font-weight:700; }
  .msg.err { color:var(--alerte); font-weight:700; }
  .note { background:var(--canal-voile); border:1px solid var(--bord-fort); border-radius:10px; padding:13px 16px;
    font-size:14px; color:#514a43; margin:0 0 16px; max-width:68ch; }
  /* Plan d'action. Une etape numerotee, son explication, et le livrable qu'elle produit.
     Le numero est dans la marge : la colonne de texte reste alignee sur le reste de la
     page, et l'oeil suit la progression sans lire les chiffres. */
  ol.etapes { list-style:none; counter-reset:et; padding:0; margin:0 0 6px; }
  ol.etapes > li { counter-increment:et; position:relative; background:var(--blanc);
    border:1px solid var(--bord); border-radius:12px; padding:15px 18px 15px 56px; margin-bottom:8px; }
  ol.etapes > li::before { content:counter(et); position:absolute; left:16px; top:15px;
    width:26px; height:26px; line-height:26px; text-align:center; border-radius:50%;
    background:var(--canal-voile); color:var(--canal-noir); font-size:13.5px; font-weight:700;
    font-variant-numeric:tabular-nums; }
  ol.etapes .quoi { display:block; font-weight:600; color:var(--encre); margin-bottom:5px; }
  ol.etapes p { margin:0; color:#514a43; font-size:15px; }
  ol.etapes .livr { display:block; margin-top:9px; font-size:14px; color:var(--gris);
    border-top:1px solid var(--bord); padding-top:8px; }
  ol.etapes .livr b { color:var(--canal-ink); font-weight:700; }
  @media (max-width: 560px) {
    ol.etapes > li { padding:14px 15px 14px 15px; }
    ol.etapes > li::before { position:static; display:inline-block; margin:0 8px 6px 0; }
  }
  /* Le livrable unique de la mission. Il se lit avant les étapes et doit se voir : c'est
     la seule chose que le client recevra à la fin. Teinte du canal, comme les pastilles. */
  /* Pas de max-width ici, contrairement aux notes : c'est un ENCADRE, et un encadre
     plus etroit que les cartes d'etapes juste en dessous se lit comme un defaut
     d'alignement. Le texte court, lui, peut s'arreter ou il veut. */
  .unlivr { background:var(--canal-voile); border:1px solid var(--bord-fort);
    border-radius:12px; padding:13px 18px; margin:0 0 12px; }
  .unlivr > b { display:block; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--canal-ink); margin-bottom:6px; }
  .unlivr .nom { display:block; font-weight:700; color:var(--encre); font-size:15.5px;
    word-break:break-word; }
  .unlivr p { margin:5px 0 0; color:#514a43; font-size:15px; }
  /* Les trois encarts qui accompagnent un challenge : ce qu'on attend du client, ce
     qu'on regarde, ce a quoi on fait attention. Meme forme, teinte du canal en filet. */
  .bloc { background:var(--blanc); border:1px solid var(--bord); border-left:3px solid var(--canal);
    border-radius:0 12px 12px 0; padding:14px 18px; margin:0 0 10px; }
  .bloc > b { display:block; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--canal-ink); margin-bottom:8px; }
  .bloc ul { margin:0; padding-left:19px; color:#514a43; font-size:15px; }
  .bloc li + li { margin-top:5px; }
  /* La vigilance sort de la teinte de son challenge : c'est le seul encart qu'il ne faut
     pas parcourir en diagonale, et son role prime sur son appartenance.
     Le filet rouge ne suffisait pas : a cote de la terracotta du challenge 1, l'oeil ne
     faisait pas la difference et l'encart disparaissait dans la serie. C'est le FOND qui
     le detache — une exception, et une seule, se lit comme un sens ; deux se lisent
     comme du bruit, donc les deux autres encarts restent blancs. */
  .bloc.vigilance { border-left-color:var(--alerte); background:var(--alerte-voile);
    border-color:#f2d9d1; border-left-color:var(--alerte); }
  .bloc.vigilance > b { color:var(--alerte); }

  /* ---------------------------------------------------------------- analyse
     UN CANAL PAR CHALLENGE. Le panneau porte le bleu ardoise pour son chrome ; chaque
     challenge REDEFINIT le canal sur sa propre teinte. Tout ce qui vit a l'interieur —
     titre, pastilles numerotees, filet des encarts, mot « Livrable » — lit deja
     var(--canal*) : la couleur se propage sans une regle de plus par element.
     Les teintes ne sont pas nouvelles : ce sont celles des trois autres onglets, deja
     mesurees sur le creme. En inventer trois de plus aurait fait sept couleurs a tenir
     pour un gain nul. Au-dela de trois challenges, on recycle (data-ch vaut 1, 2 ou 3),
     donc une fiche a cinq challenges reste lisible au lieu de tomber sans style. */
  .ch[data-ch="1"], .livch[data-ch="1"] { --canal:var(--ch1); --canal-ink:var(--ch1-ink); --canal-noir:var(--ch1-noir); --canal-voile:var(--ch1-voile); }
  .ch[data-ch="2"], .livch[data-ch="2"] { --canal:var(--ch2); --canal-ink:var(--ch2-ink); --canal-noir:var(--ch2-noir); --canal-voile:var(--ch2-voile); }
  .ch[data-ch="3"], .livch[data-ch="3"] { --canal:var(--ch3); --canal-ink:var(--ch3-ink); --canal-noir:var(--ch3-noir); --canal-voile:var(--ch3-voile); }

  /* Le titre de challenge n'est plus un simple libelle en capitales : apres trois ecrans
     de defilement, c'est LUI qui doit dire ou l'on entre. Pastille numerotee, titre en
     taille de lecture, et un filet epais dans la teinte du challenge qui ferme l'en-tete
     — la frontiere qui manquait entre deux challenges. */
  .ch { margin-top:40px; }
  .ch:first-child { margin-top:0; }
  .chtitre { display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; margin:0 0 10px;
    font-size:18px; line-height:1.35; font-weight:700; color:var(--encre); text-wrap:balance; }
  .chtitre .num { flex:none; display:inline-flex; align-items:center; height:26px; padding:0 11px;
    border-radius:999px; background:var(--canal-voile); color:var(--canal-noir);
    font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    white-space:nowrap; }
  .chbarre { height:3px; border-radius:2px; background:var(--canal); margin:0 0 14px; }

  /* Notre lecture de la situation : le seul bloc de prose de la page. Fond teinte plutot
     que carte blanche, pour qu'il ne se confonde pas avec les cartes de travail qui
     suivent.
     Pas de max-width : c'est une CARTE, et une carte qui s'arrete avant le bord alors
     que tout ce qui l'entoure va au bout se lit comme un defaut de rendu, pas comme une
     mesure de lecture. La colonne de la page borne deja la longueur de ligne. */
  .compris { background:var(--c4-voile); border:1px solid #dbe1f1; border-radius:12px;
    padding:18px 21px; font-size:15.5px; line-height:1.62; color:#3a3631; }

  /* « Les premiers jours » est un sommaire qui pointe DANS les challenges : chaque ligne
     prend la teinte du challenge qu'elle annonce, ce qui en fait la legende de tout ce
     qui suit. Sans cela, ces lignes avaient exactement la forme des etapes de challenge
     et on lisait deux fois la meme chose sans le savoir. */
  ol.parcours { list-style:none; counter-reset:p; padding:0; margin:0 0 6px; }
  ol.parcours > li { counter-increment:p; display:flex; gap:12px; align-items:baseline;
    background:var(--blanc); border:1px solid var(--bord); border-left:4px solid var(--jalon);
    border-radius:0 10px 10px 0; padding:12px 16px; margin-bottom:6px;
    font-size:15px; line-height:1.5; color:#514a43; }
  ol.parcours .rang { flex:none; align-self:center; width:23px; height:23px; line-height:23px;
    text-align:center; border-radius:50%; background:var(--jalon-voile); color:var(--jalon-noir);
    font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; }
  ol.parcours .rang::before { content:counter(p); }
  ol.parcours .ou { color:var(--jalon-ink); font-weight:700; }
  .center { text-align:center; padding:70px 20px; color:var(--gris); }
  .aide { margin-top:32px; padding-top:18px; border-top:1px solid var(--bord); color:var(--gris); font-size:14px; }
  .aide a { color:var(--canal-ink); }

  .fait { text-align:center; padding:44px 10px 20px; }
  .fait .tick { width:62px; height:62px; line-height:62px; border-radius:50%; background:var(--c2);
    color:#fff; font-size:32px; margin:0 auto 22px; }
  .fait h2 { font-size:23px; margin:0 0 16px; text-wrap:balance; }
  .fait p { max-width:520px; margin:0 auto 14px; color:#514a43; text-wrap:pretty; }
  .fait p.petit { font-size:14px; color:var(--gris-clair); }

  /* Changement d'onglet : une apparition de 160 ms, sans déplacement. Elle dit qu'on a
     changé d'écran là où une bascule sèche laisse croire que la page a sauté.
     [hidden] reste la vérité : le panneau est visible par défaut et l'animation ne fait
     que l'accompagner — un panneau dont l'affichage dépendrait d'une transition
     resterait blanc sur un rendu sans animation. */
  [role="tabpanel"]:not([hidden]) { animation:entree .16s cubic-bezier(.22,1,.36,1) both; }
  @keyframes entree { from { opacity:0 } to { opacity:1 } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<div class="wrap" id="wrap"><div class="center">Chargement…</div></div>

<script>
const FN = "https://ifutijlvjgkdaonxzzpi.supabase.co/functions/v1/clients";
const CONTACT = "contact@claudeagency.fr";
// Le jeton ouvre la fiche ET le telechargement des livrables : on le retire de la barre
// d’adresse des sa lecture, pour qu’il ne traine ni dans l’historique, ni dans une
// capture d’ecran, ni dans un Referer.
//
// Mais le retirer sans le garder nulle part rendait la page inrechargeable : un F5, ou
// un onglet restaure par le navigateur, et le client tombait sur « lien incomplet » —
// il devait retourner chercher son email. On le depose donc dans sessionStorage, qui
// vit le temps de l’onglet et disparait a sa fermeture : le rechargement fonctionne,
// sans laisser de trace durable sur un poste partage.
const CLE_JETON = "jeton_espace_client";
const PARAMS = new URLSearchParams(location.search);
// Lien d'inscription : /client?nouveau=1, communiqué aux prospects. Il ne porte aucun
// jeton et n'ouvre aucune fiche existante — il ne fait qu'écrire. On l'exige explicite
// plutôt que de déduire « pas de jeton = inscription » : un client dont le lien est
// tronqué doit lire « lien incomplet », pas se voir proposer de créer un second compte.
const MODE_INSCRIPTION = PARAMS.get("nouveau") === "1";
let TOKEN = PARAMS.get("t") || "";
// Clé manager (?k=). Elle n'arrive que par le bouton « Ouvrir l'espace client » du
// tableau de bord, et seulement pour l'admin : c'est elle qui fait apparaître l'audit
// interne des livrables. Elle suit le même traitement que le jeton — retirée de la barre
// d'adresse, gardée le temps de l'onglet — parce qu'elle en a la même valeur : ce qu'elle
// ouvre n'est destiné ni au client, ni au collaborateur. Le serveur la revérifie à chaque
// appel : la masquer ici ne protège rien à elle seule, elle évite juste d'afficher au
// client un bouton qui parle de la qualité du travail rendu.
const CLE_MANAGER = "cle_manager_espace_client";
let MANAGER = PARAMS.get("k") || "";
try {
  if (TOKEN) sessionStorage.setItem(CLE_JETON, TOKEN);
  else if (!MODE_INSCRIPTION) TOKEN = sessionStorage.getItem(CLE_JETON) || "";
  if (MANAGER) sessionStorage.setItem(CLE_MANAGER, MANAGER);
  else MANAGER = sessionStorage.getItem(CLE_MANAGER) || "";
} catch(e) { /* navigation privee stricte : le jeton reste en memoire seulement */ }
// Le paramètre d'inscription reste dans l'URL : le prospect n'a pas encore de fiche à
// protéger, et un rechargement doit lui rendre son formulaire, pas « lien incomplet ».
try { if (PARAMS.get("t") || PARAMS.get("k")) history.replaceState(null, "", location.pathname + (MODE_INSCRIPTION ? "?nouveau=1" : "") + location.hash); } catch(e){}

// Le questionnaire vit ICI et nulle part ailleurs : le libelle de chaque question est
// enregistre AVEC la reponse, donc modifier cette liste plus tard ne rend pas
// illisibles les fiches deja remplies.
// r:true = reponse obligatoire (societe, activite, challenge 1). Les autres sont
// facultatives : mieux vaut une fiche partielle envoyee qu’une fiche parfaite jamais remplie.
const QUESTIONS = [
  { s:"Votre société", q:"Votre société", h:"Nom, site web, réseaux sociaux principaux.", r:true },
  { s:"Votre société", q:"Votre activité en 2-3 phrases", h:"Que vendez-vous, et à qui ?", r:true },
  { s:"Votre société", q:"Votre client type", h:"Qui achète chez vous, quel problème vient-il résoudre, quel budget y consacre-t-il ?" },
  { s:"Votre société", q:"D’où viennent vos clients aujourd’hui", h:"Bouche-à-oreille, Google, Instagram, publicité, prescripteurs… et lequel marche le mieux ?" },
  { s:"Votre offre", q:"Vos offres et vos prix", h:"Les 1 à 3 offres sur lesquelles vous voulez que nous travaillions en priorité." },
  { s:"Votre offre", q:"Ce qui vous différencie de vos concurrents", h:"Pourquoi on vous choisit vous plutôt qu’un autre." },
  { s:"Vos challenges", q:"Challenge 1 — votre priorité", r:true,
    h:"Décrivez la mission la plus importante : ce que vous voulez obtenir, pourquoi, pour qui, ce qui existe déjà, et le résultat concret attendu d’ici un mois." },
  { s:"Vos challenges", q:"Challenge 2", h:"Une deuxième mission, si vous en avez une. Même consigne : le maximum de contexte." },
  { s:"Vos challenges", q:"Challenge 3", h:"Une troisième mission, si vous en avez une." },
  { s:"Votre contexte", q:"Ce que vous avez déjà essayé", h:"Et pourquoi ça n’a pas suffi." },
  { s:"Votre contexte", q:"Vos contraintes", h:"Budget, délais, réglementation, et surtout : ce qu’il ne faut pas faire." },
  { s:"En pratique", q:"Accès et outils", h:"Quels outils ou comptes votre interlocuteur devra utiliser (site, CRM, Drive, réseaux sociaux…)." },
  { s:"En pratique", q:"Ton de communication et validation", h:"Comment vous parlez à vos clients, qui valide les livrables et sous quel délai." }
];

// Cadre d’intervention présenté AVANT les questions et validé par une case à cocher
// obligatoire, dont la date est enregistrée en base : un avertissement que personne ne
// coche ne prouve rien. Ce texte informe et limite ; il ne remplace pas un contrat.
// Il reste dans l’onglet du questionnaire, au-dessus des questions : rangé dans un
// onglet à part, il deviendrait un onglet que le client peut ne jamais ouvrir, et une
// acceptation que personne n’a lue ne vaut pas grand-chose.
const CADRE = [
  ["Pas de données sensibles", "Ne nous transmettez ni mots de passe personnels, ni coordonnées bancaires, ni données de santé, ni fichiers contenant des données personnelles de vos propres clients. Créez-nous des accès dédiés, avec les droits strictement nécessaires, que vous pouvez retirer à tout moment."],
  ["Pas d’intervention critique sans filet", "Les missions confiées ne doivent pas porter sur des modifications lourdes de votre production : migration, refonte de base de données, système de paiement ou de facturation, infrastructure. Avant toute intervention sur un site ou un outil en service, vous devez disposer d’une sauvegarde récente et vérifiée."],
  ["Vous validez avant toute mise en ligne", "Rien n’est publié, activé ni déployé sans votre accord explicite. Ce que vous validez engage votre responsabilité."],
  ["Le travail produit avec l’IA doit être relu", "Il peut comporter des erreurs, des approximations ou des informations obsolètes. Vous le vérifiez avant publication, en particulier pour toute affirmation réglementée — santé, droit, finance — et pour tout engagement commercial ou tarifaire."],
  ["Nous nous engageons sur les moyens, pas sur les résultats", "Positionnement dans les moteurs de recherche, trafic, nombre de contacts ou chiffre d’affaires dépendent aussi de facteurs extérieurs (algorithmes, plateformes, concurrence, marché). Aucun résultat commercial n’est garanti."],
  ["Dépendance à des services tiers", "Une panne, une modification de règles ou une suspension de compte chez un prestataire tiers (hébergeur, Google, Meta, fournisseur d’IA, outil SaaS) échappe à notre contrôle et ne peut nous être imputée."],
  ["Sauvegardes et responsabilité", "Vous restez responsable de vos sauvegardes et de la continuité de votre activité. Claude Agency ne peut être tenue responsable des erreurs, pertes de données, interruptions de service, pertes d’exploitation ou préjudices indirects consécutifs aux missions demandées."],
  ["Vos droits sur ce que vous nous confiez", "Vous garantissez détenir les droits sur les éléments transmis (textes, images, marques, bases de données) et que votre activité est conforme à la réglementation qui vous concerne."],
  ["Confidentialité", "Ce que vous partagez ici n’est accessible qu’à Claude Agency et au collaborateur assigné à votre compte."]

// Formulaire public : reserver une place ne doit demander que le strict necessaire.
// Un engagement court pris maintenant se termine ; un formulaire parfait qu'on remet a
// « ce week-end » ne revient jamais. Le reste du brief se remplit juste apres, ou plus
// tard depuis le lien personnel. Cote espace client (avec jeton), rien ne change.
const REQUIS_INSCRIPTION = new Set(["Challenge 1 — votre priorité"]);
// Sur le formulaire public, le nom de la societe est deja demande en haut de page
// (champ d'identite). Reposer la question dans le brief donnait deux fois le meme
// champ a l'ecran. Elle reste posee dans l'espace client, ou le champ d'identite
// n'existe pas et ou le client complete site web et reseaux.
const EXCLUES_INSCRIPTION = new Set(["Votre société"]);
function questionAffichee(it){ return !(MODE_INSCRIPTION && EXCLUES_INSCRIPTION.has(it.q)); }
function estRequis(it){ return MODE_INSCRIPTION ? REQUIS_INSCRIPTION.has(it.q) : !!it.r; }
// A l'inscription, la consigne du challenge 1 est volontairement plus legere : on
// demande une intention, pas un cahier des charges.
const HINT_INSCRIPTION = {
  "Challenge 1 — votre priorité": "Une ou deux phrases suffisent : ce que vous voulez obtenir. On creusera ensemble au cadrage."
};
function hintDe(it){ return (MODE_INSCRIPTION && HINT_INSCRIPTION[it.q]) || it.h; }

const SECTION_NOTES = {
  "Vos challenges": "Un challenge = une mission que vous nous confiez. <b>Plus vous détaillez votre contexte, "
    + "vos besoins et vos contraintes, meilleur sera le résultat.</b> Une mission décrite en une ligne donne un "
    + "travail approximatif ; une mission décrite en dix lignes donne un travail utile."
};

// L'apostrophe est échappée ici comme dans index.html. Elle ne casse rien aujourd'hui —
// aucune valeur venue du client n'atterrit dans un attribut délimité par des apostrophes —
// mais la première fois qu'on en ajoutera un, personne ne se souviendra que cette page
// avait sa propre règle. Les deux pages sont désormais réellement identiques, et
// tools/test-echappement.js le vérifie sur les deux.
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// T12:00:00 : sans heure, une date seule est lue en UTC et peut reculer d’un jour.
function jour(iso){ return iso ? new Date(String(iso).slice(0,10) + "T12:00:00") : null; }
const FMT_COURT = new Intl.DateTimeFormat("fr-FR", { day:"2-digit", month:"2-digit", year:"numeric" });
function dateCourte(iso){ const d = jour(iso); return d ? FMT_COURT.format(d) : ""; }

// Brouillon local : la saisie est recopiée dans le navigateur du client à chaque frappe.
// Sans ça, un client qui remplit les questions facultatives, laisse une obligatoire vide
// et ferme son onglet perd tout — l’enregistrement serveur lui étant refusé.
// Tout est en try/catch : en navigation privée, localStorage peut lever une exception.
const DRAFT_KEY = "fiche_client_" + TOKEN.slice(0, 16);
function readDraft(){ try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null") || null; } catch(e) { return null; } }
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch(e) {} }
function writeDraft(){
  try {
    const o = {};
    QUESTIONS.forEach((it, i) => { const el = document.getElementById("f" + i); if (el && el.value.trim()) o[it.q] = el.value; });
    if (Object.keys(o).length) localStorage.setItem(DRAFT_KEY, JSON.stringify(o)); else localStorage.removeItem(DRAFT_KEY);
  } catch(e) {}
}

// Où en est le remplissage. Ne compte QUE les questions obligatoires : ce sont les
// seules qui bloquent l'envoi, et afficher « 4 sur 13 » à un client qui a déjà tout ce
// qu'il faut pour démarrer lui donne l'impression d'être en retard alors qu'il peut
// envoyer. Les facultatives sont mentionnées à côté, sans jauge.
function majAvancement(){
  const barre = document.getElementById("jauge");
  const txt = document.getElementById("avancetxt");
  const zone = document.getElementById("avance");
  if (!barre || !txt || !zone) return;
  const valeur = (id) => { const el = document.getElementById(id); return !!(el && el.value.trim()); };
  const rempli = (i) => valeur("f" + i);
  // Sur le formulaire public, la société et l'email sont obligatoires eux aussi : les
  // exclure affichait « 0 sur 3 » à un prospect qui venait de remplir deux champs
  // marqués « obligatoire » juste au-dessus de la jauge.
  const champs = MODE_INSCRIPTION ? ["fsoc", "fmail"] : [];
  const oblig = QUESTIONS.map((it, i) => estRequis(it) ? i : -1).filter((i) => i >= 0);
  const total = oblig.length + champs.length;
  const faits = oblig.filter(rempli).length + champs.filter(valeur).length;
  barre.style.width = Math.round((faits / total) * 100) + "%";
  const complet = faits === total;
  zone.classList.toggle("pleine", complet);
  // Une ligne courte, qui tient à côté de la jauge. La version longue passait à la ligne
  // et occupait plus de place que la consigne juste au-dessus.
  txt.textContent = complet
    ? (MODE_INSCRIPTION ? "Vous pouvez envoyer votre demande." : "Vous pouvez envoyer votre fiche.")
    : faits + " sur " + total + " réponses obligatoires";
}

async function post(body){
  const r = await fetch(FN, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}

let DATA = null;
let ONGLET = "";

// ---------------------------------------------------------------- onglets
// `canal` : le numero de la couleur portee par l'onglet et par tout son panneau.
// Le canal 1 (terracotta) n'est plus porte par aucun onglet depuis le 08/08/2026 : « Ou
// en est votre projet » a ete supprime. Ses variables --c1* servent encore au bandeau de
// titre et au reperage « en cours de production », donc on ne les retire pas — et on ne
// renumerote pas les trois autres, qui garderaient sinon un nom sans rapport avec leur
// teinte partout ailleurs dans la page.
const ONGLETS = [
  { id:"livrables",  titre:"Vos livrables",          canal:2 },
  { id:"fiche",      titre:"Votre fiche client",     canal:3 },
  // L'analyse arrive apres la fiche parce qu'elle en decoule : on lit d'abord ce qu'on
  // a dit, ensuite ce que l'agence en fait. Elle est chargee a la premiere ouverture de
  // l'onglet et pas au chargement de la page — la produire coute un appel a un modele,
  // et rien ne justifie de le payer pour un client venu telecharger un fichier.
  { id:"analyse",    titre:"Analyse client",         canal:4 }
];

// Onglet d’arrivée : les livrables, toujours (demande de Julien, 08/08/2026). C’est ce
// que le client vient chercher ; sa fiche, il l’a déjà remplie une fois. Le fragment
// d’URL prime : il permet de revenir sur le même onglet après un rechargement.
function ongletParDefaut(){
  const voulu = (location.hash || "").replace(/^#/, "");
  return ONGLETS.some(o => o.id === voulu) ? voulu : "livrables";
}

function setOnglet(id, deplacerLeFocus){
  if (!ONGLETS.some(o => o.id === id)) return;
  ONGLET = id;
  ONGLETS.forEach(o => {
    const bouton = document.getElementById("t-" + o.id);
    const panneau = document.getElementById("p-" + o.id);
    const actif = o.id === id;
    if (bouton) { bouton.setAttribute("aria-selected", actif ? "true" : "false"); bouton.tabIndex = actif ? 0 : -1; }
    if (panneau) panneau.hidden = !actif;
  });
  // replaceState et non pushState : le bouton « retour » du navigateur doit ramener le
  // client d’où il vient, pas lui faire remonter un à un les onglets qu’il a ouverts.
  try { history.replaceState(null, "", location.pathname + "#" + id); } catch(e){}
  if (deplacerLeFocus) { const b = document.getElementById("t-" + id); if (b) b.focus(); }
  // Chargement paresseux : le plan n'est demande qu'a la premiere ouverture de son
  // onglet. Un client venu telecharger un livrable ne declenche aucun appel de modele.
  if (id === "analyse") chargerAnalyse(false);
}

function clavierOnglets(e){
  const i = ONGLETS.findIndex(o => o.id === ONGLET);
  let j = -1;
  if (e.key === "ArrowRight") j = (i + 1) % ONGLETS.length;
  else if (e.key === "ArrowLeft") j = (i - 1 + ONGLETS.length) % ONGLETS.length;
  else if (e.key === "Home") j = 0;
  else if (e.key === "End") j = ONGLETS.length - 1;
  if (j < 0) return;
  e.preventDefault();
  setOnglet(ONGLETS[j].id, true);
}

function barreOnglets(data){
  const n = (data.files || []).length;
  return '<div class="tabs" role="tablist" aria-label="Sections de votre espace">'
    + ONGLETS.map(o =>
        '<button type="button" class="tab" role="tab" id="t-' + o.id + '" data-canal="' + o.canal + '"'
        + ' aria-controls="p-' + o.id + '" aria-selected="false" tabindex="-1">'
        + esc(o.titre)
        + (o.id === "livrables" && n ? '<span class="n">' + esc(n) + '</span>' : '')
        + '</button>').join("")
    + '</div>';
}

// Repères d'arrivée. On n'affiche que ce qui existe : sur un dossier qui démarre, une
// ligne de « — » partout dirait au client qu'il est en retard alors qu'il vient
// d'arriver. Chaque repère prend la couleur de l'onglet qui le détaille — donc plus de
// date de dernier point depuis que l'onglet qui la détaillait a disparu.
function reperes(data){
  const items = [];
  const n = (data.files || []).length;
  if (n) items.push([2, '<b>' + esc(n) + '</b> livrable' + (n > 1 ? 's' : '') + ' à télécharger']);
  if (data.answered_at) items.push([3, 'Fiche envoyée le <b>' + esc(dateCourte(data.answered_at)) + '</b>']);
  if (!items.length) return "";
  return '<ul class="reperes">'
    + items.map(([c, t]) => '<li data-canal="' + c + '"><span class="pt" aria-hidden="true"></span>' + t + '</li>').join("")
    + '</ul>';
}

// Les boutons qui renvoient vers un autre onglet, où qu'ils soient dans la page.
function brancherLiensOnglets(){
  document.querySelectorAll('[data-vers]').forEach(x =>
    x.addEventListener("click", () => setOnglet(x.dataset.vers, true)));
}

function aideContact(intro){
  const sujet = encodeURIComponent((DATA && DATA.company ? DATA.company + " — " : "") + "question sur mon suivi");
  return '<div class="aide">' + esc(intro) + ' '
    + '<a href="mailto:' + CONTACT + '?subject=' + sujet + '">Écrivez à votre interlocuteur</a>, '
    + 'ou répondez simplement à l’email que vous avez reçu.</div>';
}

// ---------------------------------------------------------------- panneau : livrables
function panneauLivrables(data){
  const fs = Array.isArray(data.files) ? data.files : [];
  // Une panne côté dépôt ne doit JAMAIS se lire comme « rien n'a été produit » : le
  // client en conclurait qu'on ne travaille pas sur son dossier.
  if (data.depot_ko) {
    return '<div class="vide"><b>Liste momentanément indisponible.</b>'
      + '<p>Nous n’arrivons pas à joindre l’espace de stockage de vos fichiers à cet '
      + 'instant. Rien n’est perdu : réessayez dans quelques minutes. Si le message '
      + 'persiste, signalez-le à votre interlocuteur.</p></div>';
  }
  if (!fs.length) {
    return '<div class="vide"><b>Aucun livrable pour le moment.</b>'
      + '<p>Les fichiers produits pour vous apparaissent ici dès qu’ils sont déposés, '
      + 'et vous pouvez les télécharger à tout moment. Tant que rien ne s’affiche, '
      + 'c’est que la production n’a pas encore commencé.</p></div>';
  }
  // Groupés par challenge : un client suit ses missions, pas une arborescence de fichiers.
  const parChallenge = new Map();
  fs.forEach(f => {
    const k = Number(f.challenge || 0);
    if (!parChallenge.has(k)) parChallenge.set(k, []);
    parChallenge.get(k).push(f);
  });
  const cles = Array.from(parChallenge.keys()).sort((a, b) => a - b);
  // Deux états, et il faut qu'ils se distinguent : un fichier déjà transmis avec un point
  // d'avancement, et un fichier en cours de production que le client voit arriver. Sans
  // cette mention, un brouillon déposé ce midi se lirait comme un livrable fini.
  const enCours = fs.filter(f => !f.transmis).length;
  let h = '<div class="secnote">Cliquez sur un fichier pour le télécharger. Ils restent disponibles ici '
        + 'aussi longtemps que votre projet est suivi.'
        + (enCours ? ' Les fichiers marqués « en cours de production » sont en cours d’écriture : '
            + 'vous pouvez les ouvrir, ils ne sont pas encore finalisés.' : '')
        + '</div>';
  cles.forEach(k => {
    // Les fichiers que le client a lui-même envoyés sont sortis de la liste des
    // livrables : elle répond à « qu'a-t-on produit pour moi ? ». Les y mêler ferait
    // compter ses propres envois parmi les travaux rendus.
    const livrables = parChallenge.get(k).filter(f => !f.retour);
    const retours = parChallenge.get(k).filter(f => f.retour);
    // Une teinte par challenge, recyclée au-delà de trois : une fiche à cinq missions
    // reste lisible au lieu de tomber sans style. Les « Documents généraux » (k = 0) ne
    // sont pas une mission et gardent la teinte de l'onglet, sans fond.
    h += (k ? '<section class="livch" data-ch="' + esc(String((k - 1) % 3 + 1)) + '">' : '<section>')
      + '<h2 class="sec">' + (k ? 'Challenge ' + esc(k) : 'Documents généraux') + '</h2>'
      + (livrables.length ? '' : '<div class="secnote">Aucun livrable pour cette mission pour l’instant.</div>')
      + '<ul class="liv">'
      + livrables.map(f =>
          '<li><button type="button" class="dl" data-i="' + esc(String(f.i)) + '">'
          + '<span class="nom"><span class="fl" aria-hidden="true">↓</span>'
          + '<span class="txt">' + esc(f.file) + '</span></span>'
          // Un challenge clôturé n'a plus de fichier « en cours de production » : la
          // mention se lisait comme un travail encore ouvert alors que la mission est
          // close. La date de transmission, elle, reste : elle dit autre chose.
          + '<span class="quand">' + (f.transmis && f.date
              ? 'transmis le ' + esc(dateCourte(f.date))
              : f.termine
                ? '<span class="fini">terminé</span>'
                : '<span class="encours">en cours de production</span>') + '</span>'
          + '</button>' + blocVersions(f) + '</li>').join("")
      + '</ul>'
      + blocEtat(k, data)
      + blocRetours(k, retours, livrables.length)
      + blocAudit(data, k, livrables)
      + '</section>';
  });
  return h + '<div class="msg" id="dlmsg" aria-live="polite"></div>' + aideContact("Un fichier ne s’ouvre pas ?");
}

// Les versions successives d'un même fichier. Un fichier redéposé sous le même nom
// écrase le précédent sur le dépôt : sans ce bloc, la page affiche la dernière version
// et rien ne dit qu'il y en a eu d'autres. `versions[0]` est celle qui est en ligne —
// c'est le bouton du dessus, on ne la répète pas.
//
// Le serveur n'envoie que des dates et des empreintes de commit : ni chemin, ni nom de
// collaborateur. Le nom du fichier voyage à part (`data-nom`) parce que le serveur le
// compare à celui de l'indice avant de servir quoi que ce soit.
function blocVersions(f){
  const vs = Array.isArray(f.versions) ? f.versions : [];
  if (vs.length < 2) return "";
  const avant = vs.slice(1);
  return '<details class="vers"><summary>' + avant.length + ' version'
    + (avant.length > 1 ? 's' : '') + ' précédente' + (avant.length > 1 ? 's' : '') + '</summary><ul>'
    + avant.map(v =>
        '<li><button type="button" class="dl" data-i="' + esc(String(f.i)) + '"'
        + ' data-ref="' + esc(String(v.sha)) + '" data-nom="' + esc(f.file) + '">'
        + '<span class="nom"><span class="fl" aria-hidden="true">↓</span>'
        + '<span class="txt">version du ' + esc(horodate(v.date)) + '</span></span>'
        + '</button></li>').join("")
    + '</ul></details>';
}
// L'heure et pas seulement le jour : deux versions déposées le même jour sont le cas
// courant, et deux lignes identiques ne se distinguent plus.
function horodate(iso){
  const d = new Date(String(iso || ""));
  if (isNaN(d)) return "";
  return FMT_COURT.format(d) + ' à ' + d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
}

// ------------------------------------------------- envoi d'un fichier par challenge
//
// Deux boutons pour un seul mécanisme, et c'est le serveur qui distingue lequel : avec
// la clé de manager il dépose une version revue À CÔTÉ du fichier du collaborateur,
// sans elle il range le fichier dans les retours du client. La page n'a donc rien à
// prouver — un client qui bricolerait l'affichage n'obtiendrait que le mode client.
//
// Le manager ne voit pas le bouton du client : il est sur cette page pour relire, pas
// pour répondre à sa propre agence.
// L'état d'un challenge, et le bouton qui le fait changer. Deux gestes différents sous
// un même bouton, et c'est le SERVEUR qui tranche lequel d'après la clé de manager :
//   manager — clôture le challenge ;
//   client  — le valide, ce qui ne le ferme pas. Décision de Julien du 05/08/2026 : ce
//             lien peut circuler, et un clic d'exploration ne doit pas clore une mission
//             facturée. Seul le manager peut rouvrir, et cela ne se fait pas ici.
function blocEtat(k, data){
  if (!k) return "";
  const e = (data.challenges || []).find(x => Number(x.n) === Number(k));
  if (!e) return "";
  const quand = t => t ? dateCourte(t) : "";
  if (e.termine) {
    return '<div class="etatch fini"><b>Challenge terminé</b>'
      + '<span>Marqué terminé' + (e.termine_par ? ' par ' + esc(e.termine_par) : '')
      + (e.termine_at ? ' le ' + esc(quand(e.termine_at)) : '') + '.'
      + (e.valide_at ? ' Validé par ' + esc(e.valide_par || 'vous') + ' le ' + esc(quand(e.valide_at)) + '.' : '')
      + '</span></div>';
  }
  if (MANAGER) {
    return '<div class="etatch">'
      + (e.valide_at ? '<b>Validé par ' + esc(e.valide_par || 'le client') + ' le ' + esc(quand(e.valide_at)) + '</b>'
                     : '<b>Challenge en cours</b>')
      + '<span>' + (e.valide_at ? 'Le client a donné son accord. ' : '')
      + 'Clôturez-le quand le travail est fini — vous seul pouvez le rouvrir ensuite.</span>'
      + '<button type="button" class="etatgo" data-ch="' + esc(String(k)) + '">Marquer ce challenge terminé</button>'
      + '<div class="auditnote" id="etatmsg-' + esc(String(k)) + '" aria-live="polite"></div></div>';
  }
  if (e.valide_at) {
    return '<div class="etatch"><b>Vous avez validé ce challenge</b>'
      + '<span>Le ' + esc(quand(e.valide_at)) + '. Nous le clôturons de notre côté ; '
      + 'si quelque chose vous manque encore, écrivez-le-nous.</span></div>';
  }
  return '<div class="etatch"><b>Ce travail vous convient ?</b>'
    + '<span>Dites-le-nous en un clic. Cela ne ferme rien : nous relisons, puis nous clôturons la mission.</span>'
    + '<button type="button" class="etatgo" data-ch="' + esc(String(k)) + '">Valider ce challenge</button>'
    + '<div class="auditnote" id="etatmsg-' + esc(String(k)) + '" aria-live="polite"></div></div>';
}

function brancherEtats(){
  document.querySelectorAll(".etatgo").forEach(btn => {
    btn.addEventListener("click", async () => {
      const k = btn.dataset.ch, out = document.getElementById("etatmsg-" + k);
      const libelle = btn.textContent;
      btn.disabled = true; btn.textContent = "Enregistrement…";
      try {
        await post({ action:"challenge-valider", token:TOKEN, k:MANAGER || undefined, challenge:Number(k) });
        if (out) out.textContent = "✓ Enregistré.";
        setTimeout(() => location.reload(), 900);
      } catch(e) {
        if (out) out.textContent = "Impossible : " + e.message;
        btn.disabled = false; btn.textContent = libelle;
      }
    });
  });
}

function blocRetours(k, retours, nbLivrables){
  if (!k) return "";
  let h = "";
  if (retours.length) {
    h += '<div class="secnote" style="margin-top:14px"><b>Vos fichiers envoyés</b></div><ul class="liv">'
      + retours.map(f =>
          '<li><button type="button" class="dl" data-i="' + esc(String(f.i)) + '">'
          + '<span class="nom"><span class="fl" aria-hidden="true">↓</span>'
          + '<span class="txt">' + esc(f.file) + '</span></span>'
          + '<span class="quand">envoyé par vous</span></button>' + blocVersions(f) + '</li>').join("")
      + '</ul>';
  }
  if (MANAGER) {
    h += '<div class="audit"><input type="file" id="up-' + esc(String(k)) + '">'
      + '<button type="button" class="auditgo upgo" data-ch="' + esc(String(k)) + '">Déposer une version revue · interne</button>'
      + '<div class="auditnote">Visible par vous seul. Le fichier du collaborateur n’est pas remplacé : '

    return h;
  }
  // Côté client : uniquement là où un livrable existe. Proposer d'envoyer un fichier sur

    + '<div class="auditnote" id="upmsg-' + esc(String(k)) + '" aria-live="polite"></div></div>';
