// btoa() par tranches de 32 Ko : String.fromCharCode appliqué d'un coup à un tableau de
// plusieurs mégaoctets lève un RangeError — un plantage muet au moment précis où le
// fichier est le plus gros.
function versB64(buf){
  const o = new Uint8Array(buf); let s = "";
  for (let i = 0; i < o.length; i += 0x8000) s += String.fromCharCode.apply(null, o.subarray(i, i + 0x8000));
  return btoa(s);
}

const UP_MAX = 8 * 1024 * 1024;

function brancherEnvois(){
  document.querySelectorAll(".upgo").forEach(btn => {
    btn.addEventListener("click", async () => {
      const k = btn.dataset.ch;
      const inp = document.getElementById("up-" + k), out = document.getElementById("upmsg-" + k);
      const f = inp && inp.files && inp.files[0];
      if (!f) { if (out) out.textContent = "Choisissez d’abord un fichier."; return; }
      if (f.size > UP_MAX) { if (out) out.textContent = "Fichier trop volumineux (8 Mo maximum)."; return; }
      const libelle = btn.textContent;
      btn.disabled = true; btn.textContent = "Envoi…";
      if (out) out.textContent = "";
      try {
        const d = await post({ action:"upload", token:TOKEN, k:MANAGER || undefined,
          challenge:Number(k), file:{ name:f.name, b64:versB64(await f.arrayBuffer()) } });
        // `prevenu` faux : le fichier est bien déposé, mais l'email n'est pas parti. Le
        // dire, sinon on croit quelqu'un averti alors que personne ne l'est.
        if (out) out.textContent = "✓ " + d.file + " déposé."
          + (d.prevenu ? " Un email vient de partir." : " En revanche, l’email de notification n’a pas pu être envoyé.");
        if (inp) inp.value = "";
        setTimeout(() => location.reload(), 1800);
      } catch(e) { if (out) out.textContent = "Envoi impossible : " + e.message; }
      btn.disabled = false; btn.textContent = libelle;
    });
  });
}

// ------------------------------------------------- verification d'un challenge (manager)
// N'existe QUE pour le manager : sans cle, ces fonctions rendent une chaine vide et la
// page reste celle que le client a toujours vue, au pixel pres.
//
// Ce bloc n'appelle plus aucun modele depuis la page (08/08/2026). L'audit serveur
// (`clients` action `review` -> `analyze-deliverables`) rendait des critiques trop
// courtes pour decider quoi que ce soit ; il est remplace par un prompt que Julien colle
// dans Claude Desktop en mode agent local — le seul endroit qui ait `gh`, le depot prive
// et Opus 5, donc le seul ou la skill `verification-travail-collaborateur` puisse OUVRIR
// les fichiers au lieu de les croire. L'action serveur reste deployee mais plus rien ne
// l'appelle : ne pas la rebrancher ici.
//
// La page ne connait ni le nom du collaborateur ni le contenu des fichiers, et ca reste
// ainsi — c'est une page que le client charge aussi. La skill va les chercher elle-meme
// dans les commits du depot.
const DEPOT = "JRAYES000/livrables-Claude-Agency";

// Meme regle que `slugClient()` du tableau de bord, qui fait foi : c'est elle qui a nomme
// les dossiers du depot. La changer d'un seul cote donnerait un chemin qui n'existe pas.
function slugDepot(s){
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")
    .slice(0, 40).replace(/-+$/, "") || "fiche";
}

// Le prompt, en TEXTE BRUT : il part au presse-papiers, jamais dans le DOM. Donc pas
// d'`esc()` ici — il transformerait les apostrophes de l'enonce en `&#39;` au milieu du
// prompt colle dans Claude.
// La date de depot vient de `versions[0]` — le dernier commit qui a touche ce fichier,
// donc la seule chronologie fiable. Le nom ne la porte pas : sur le challenge 2 d'Ecole
// Naturo, la version la plus recente s'appelle `…-challenge-v4.xlsx` et ne contient meme
// pas le numero du challenge, quand `…-challenge-2-v3.xlsx` est plus ancienne. Trie par
// nom, un correcteur auditerait la mauvaise version sans que rien ne le signale.
// `f.date` est la date de TRANSMISSION au client, pas celle du depot : elle ne remplace
// pas la premiere, elle repond a une autre question.
function deposeLe(f){
  const v = (Array.isArray(f.versions) ? f.versions : [])[0];
  return v && v.date ? dateCourte(v.date) : "";
}
function promptVerif(data, k, fichiers){
  const dossier = slugDepot(data.company) + "/" + (k ? "challenge-" + k + "/" : "");
  const enonce = (data.answers || [])
    .filter(a => new RegExp("^\\s*challenge\\s*" + k + "\\b", "i").test(String(a.q || "")))
    .map(a => String(a.a || "").trim()).filter(Boolean).join("\n\n");
  // Du plus recent au plus ancien : la derniere version rendue est la premiere lue, et
  // c'est elle qu'on audite. Les fichiers sans date connue ferment la liste.
  const tries = fichiers.slice().sort((a, b) => {
    const da = (Array.isArray(a.versions) && a.versions[0] || {}).date || "";
    const db = (Array.isArray(b.versions) && b.versions[0] || {}).date || "";
    return db.localeCompare(da);
  });
  return [
    "/verification-travail-collaborateur",
    "",
    "Client : " + (data.company || "") + (k ? " — challenge " + k + "." : " — documents generaux."),
    "Depot prive : https://github.com/" + DEPOT,
    "Dossier du travail rendu : " + dossier,
    "Le collaborateur qui a depose se lit dans les commits de ce dossier, pas ici.",
    "",
    "Pour lire le dossier (gh est authentifie sur ce poste, le depot est prive) :",
    "  gh api \"repos/" + DEPOT + "/git/trees/HEAD?recursive=1\" \\",
    "    --jq '.tree[] | select(.type==\"blob\") | select(.path|startswith(\"" + dossier + "\")) | .path'",
    "  gh api \"repos/" + DEPOT + "/contents/<chemin>\" --jq .content | base64 -d > <fichier>",
    "Un fichier binaire — image, PDF, classeur, archive — se telecharge puis s'OUVRE avec",
    "l'outil qui convient a son format. Le decoder en texte ne rend que du binaire, et une",
    "preuve parfaitement lisible passerait a tort en « Non verifiable ici ».",
    "MISSION.md, LISEZ-MOI.md et QUESTIONNAIRE.md sont regeneres par le serveur : ce ne",
    "sont pas des livrables.",
    "",
    "Actions demandees : le document du dossier qui dit ce qui devait etre fait — grille",
    "d'actions, plan, cahier des charges, README, quelle que soit sa forme. C'est lui le",
    "contrat. Si tu n'en trouves pas, demande-le-moi avant d'aller plus loin : l'enonce plus",
    "bas est un contexte, pas un contrat. Je colle a la suite, s'il y a lieu : mon dernier",
    "retour, et l'email ou le fichier qui fait foi.",
    "",
    "Perimetre : tout le challenge, tous les fichiers du dossier, a chaque controle.",
    "Sortie attendue : le tableau de controle action par action, puis le message a envoyer",
    "au collaborateur (skill message-outlook).",
    "",
    "Fichiers vus par le portail (" + tries.length + "), du plus recent au plus ancien.",
    "Le nom ne dit pas l'anciennete : c'est la date de depot qui tranche.",
    tries.map(f => {
      const d = deposeLe(f), t = f.transmis ? "deja transmis au client" : "pas encore transmis";
      return "- " + f.file + (d ? " — depose le " + d : "") + " · " + t;
    }).join("\n"),
    "",
    "--- Contexte : ce que le client a ecrit dans sa fiche pour ce challenge ---",
    enonce || "(rien pour ce challenge dans la fiche)"
  ].join("\n");
}

// Le prompt est fabrique au rendu et range ici : le bouton n'a plus qu'a le copier, et la
// copie reste dans le geste de l'utilisateur — un `await` avant `writeText()` fait perdre
// l'autorisation au presse-papiers sur Safari.
const PROMPTS = {};

function blocAudit(data, k, fichiers){
  if (!MANAGER) return "";
  PROMPTS[String(k)] = promptVerif(data, k, fichiers);
  return '<div class="audit">'
    + '<button type="button" class="auditgo verifgo" data-ch="' + esc(String(k)) + '">'
    + 'Copier le prompt de vérification · interne</button>'
    + '<div class="auditnote">Visible par vous seul. À coller dans Claude Desktop, mode agent local : '
    + 'la skill ouvre les fichiers sur le dépôt, rend le tableau de contrôle action par action, '
    + 'puis le message à envoyer au collaborateur.</div>'
    + '<div class="auditout" id="audit-' + esc(String(k)) + '" aria-live="polite"></div>'
    + '</div>';
}

// La copie peut echouer : sans HTTPS, sans geste reconnu, ou parce que la fenetre n'a pas
// le focus. Afficher « Copie » dans ces cas-la ferait coller un presse-papiers vide dans
// Claude. On depose alors le prompt dans un champ selectionne, prêt pour Ctrl+C.
function brancherAudits(){
  document.querySelectorAll(".verifgo").forEach(btn => {
    btn.addEventListener("click", () => {
      const k = btn.dataset.ch, out = document.getElementById("audit-" + k);
      const txt = PROMPTS[k] || "";
      if (!out) return;
      if (!txt) { out.textContent = "Prompt indisponible — rechargez la page."; return; }
      const secours = () => {
        out.innerHTML = '<div>Copie refusée par le navigateur — le prompt est ci-dessous, '
          + 'faites Ctrl+C.</div><textarea readonly rows="8" '
          + 'style="width:100%;margin-top:8px;font:inherit;font-size:12.5px"></textarea>';
        const z = out.querySelector("textarea");
        z.value = txt; z.focus(); z.select();
      };
      try {
        navigator.clipboard.writeText(txt)
          .then(() => { out.textContent = "✓ Copié. Collez-le dans Claude Desktop (mode agent local)."; })
          .catch(secours);
      } catch(e) { secours(); }
    });
  });
}

// ---------------------------------------------------------------- panneau : analyse
// Le plan d'action que l'agence tire de la fiche. Il est VISIBLE PAR LE CLIENT : la
// consigne donnee au modele (fonction `clients`, action `analysis`) lui interdit les
// noms de collaborateurs, les estimations de charge et les promesses chiffrees. Ce qui
// s'affiche ici doit pouvoir etre lu par les deux cotes de la table.
let ANALYSE = null;      // dernier etat connu, pour ne pas rappeler le serveur a chaque bascule
let ANALYSE_ENCOURS = false;

function listeBloc(titre, items, classe){
  if (!items || !items.length) return "";
  return '<div class="bloc' + (classe ? ' ' + classe : '') + '"><b>' + esc(titre) + '</b><ul>'
       + items.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul></div>';
}

// Teinte d'un challenge. Le rang dans la liste sert d'index, pas le numéro annoncé :
// une fiche dont les challenges portent les numéros 2 et 5 garde ainsi deux couleurs
// distinctes, et une fiche à cinq challenges recycle les trois canaux au lieu de tomber
// sans style. Trois teintes suffisent : au-delà, l'œil ne les distingue plus.
function canalCh(rang){ return (rang % 3) + 1; }
function varsJalon(n){
  return '--jalon:var(--c' + n + ');--jalon-ink:var(--c' + n + '-ink);'
       + '--jalon-noir:var(--c' + n + '-noir);--jalon-voile:var(--c' + n + '-voile);';
}
// « Challenge 2 · Repérer les bureaux » → on isole le renvoi pour le colorer et le
// mettre en gras. Défensif : une ligne qui ne commence pas par un renvoi reste affichée
// telle quelle, en teinte neutre.
const RENVOI_CH = /^\s*(?:challenge|défi|defi)\s*(\d+)\s*(?:[:·•.)\-–—]\s*)?/i;

function planHtml(a, at, perimee){
  let h = "";
  if (perimee) {
    h += '<div class="note">Votre fiche a changé depuis cette analyse. Nous la mettons à jour ; '
       + 'ce que vous lisez ci-dessous reste la version précédente.</div>';
  }
  // Table des teintes AVANT tout rendu : le sommaire des premiers jours doit annoncer
  // chaque challenge dans la couleur que ce challenge portera plus bas.
  const chs = Array.isArray(a.challenges) ? a.challenges : [];
  const teinte = {};
  chs.forEach((ch, i) => { teinte[String(ch.numero)] = canalCh(i); });

  if (a.comprehension) {
    h += '<h2 class="sec">Ce que nous avons compris</h2>'
       + '<div class="compris">' + esc(a.comprehension) + '</div>';
  }
  if (a.premiere_semaine && a.premiere_semaine.length) {
    h += '<h2 class="sec">Les premiers jours</h2>'
       + '<div class="secnote">Ce par quoi nous commençons, dans cet ordre. La couleur de chaque '
       + 'ligne est celle du challenge auquel elle appartient.</div>'
       + '<ol class="parcours">' + a.premiere_semaine.map(x => {
           const txt = String(x == null ? "" : x);
           const m = txt.match(RENVOI_CH);
           const n = m ? teinte[m[1]] : null;
           const reste = m ? txt.slice(m[0].length) : txt;
           return '<li style="' + varsJalon(n || 4) + '">'
                + '<span class="rang" aria-hidden="true"></span><span>'
                + (m ? '<span class="ou">Challenge ' + esc(m[1]) + '</span> · ' : '')
                + esc(reste) + '</span></li>';
         }).join("") + '</ol>';
  }
  chs.forEach((ch, i) => {
    h += '<section class="ch" data-ch="' + canalCh(i) + '">'
       + '<h2 class="chtitre"><span class="num">Challenge ' + esc(ch.numero) + '</span>'
       + (ch.titre ? '<span>' + esc(ch.titre) + '</span>' : '') + '</h2>'
       + '<div class="chbarre" aria-hidden="true"></div>';
    if (ch.objectif) h += '<div class="secnote">' + esc(ch.objectif) + '</div>';
    // Un seul livrable par mission (31/07). Il s'annonce AVANT les étapes : le client
    // voit d'abord ce qu'il recevra, les étapes deviennent alors la façon d'y arriver.
    if (ch.livrable && (ch.livrable.nom || ch.livrable.description)) {
      h += '<div class="unlivr"><b>Votre livrable</b>'
         + (ch.livrable.nom ? '<span class="nom">' + esc(ch.livrable.nom) + '</span>' : '')
         + (ch.livrable.description ? '<p>' + esc(ch.livrable.description) + '</p>' : '')
         + '</div>';
    }
    if (ch.etapes && ch.etapes.length) {
      // `onglet` = la part du classeur que cette étape remplit. `livrable` reste lu pour
      // les analyses produites avant le passage au livrable unique.
      const partLabel = ch.livrable ? 'Onglet' : 'Livrable';
      h += '<ol class="etapes">' + ch.etapes.map(e =>
          '<li>' + (e.titre ? '<span class="quoi">' + esc(e.titre) + '</span>' : '')
        + (e.detail ? '<p>' + esc(e.detail) + '</p>' : '')
        + ((e.onglet || e.livrable) ? '<span class="livr"><b>' + partLabel + '</b> · ' + esc(e.onglet || e.livrable) + '</span>' : '')
        + '</li>').join("") + '</ol>';
    }
    h += listeBloc("Ce dont nous avons besoin de vous", ch.besoins)
       + listeBloc("Comment nous verrons que ça avance", ch.indicateurs)
       + listeBloc("Points de vigilance", ch.vigilance, "vigilance")
       + '</section>';
  });
  if (a.questions && a.questions.length) {
    h += '<h2 class="sec">Ce qu’il nous reste à préciser avec vous</h2>'
       + '<div class="secnote">Nous vous poserons ces questions au cadrage. Vous pouvez aussi '
       + 'répondre dès maintenant par email si vous le souhaitez.</div>'
       + '<ul class="liv" style="list-style:disc;padding:14px 18px 14px 36px">'
       + a.questions.map(q => '<li>' + esc(q) + '</li>').join("") + '</ul>';
  }
  // Le cadre d'intervention dit que le travail produit avec l'IA doit etre relu. Le
  // dire ici aussi, a l'endroit ou le client lit justement un texte produit ainsi.
  h += '<div class="aide">Plan établi le ' + esc(dateCourte(at)) + ' à partir de votre fiche, '
     // Ne pas ecrire « relu par votre interlocuteur » : au moment ou le client lit cette
     // ligne, personne ne l'a encore relu. Le cadre d'intervention demande justement que
     // le travail produit avec l'IA soit verifie — autant ne pas mentir dessus.
     + 'avec l’aide de l’IA. Votre interlocuteur le reprendra avec vous au cadrage : '
     + 'c’est une base de discussion, pas un engagement de résultat.</div>';
  return h;
}

function panneauAnalyse(data){
  const fiche = (data.answers || []).some(a => /challenge\s*1/i.test(a.q) && a.a);
  if (!fiche) {
    return '<div class="vide"><b>Décrivez d’abord vos challenges.</b>'
      + '<p>Dès que votre fiche décrit au moins une mission, nous en tirons un plan d’action '
      + 'détaillé : les étapes, ce que chacune produit, et ce dont nous avons besoin de vous.</p>'
      + '<p><button type="button" class="lien" data-vers="fiche">Aller à ma fiche</button></p></div>';
  }
  return '<div id="zoneanalyse"><div class="center">Chargement…</div></div>';
}

// Le premier appel ne génère rien — il dit ce qui existe. C'est ce qui permet d'afficher
// tout de suite un plan déjà calculé, et un écran d'attente honnête quand il faut le
// fabriquer.
//
// Ensuite on boucle, et ce n'est pas de l'impatience : depuis le 04/08/2026 le plan est
// rédigé par Claude Max sur le poste de l'agence, qui ne traite qu'une demande à la fois.
// Chaque appel produit UN morceau — une mission, puis le cadrage — et rend la main ;
// enchaîner les quatre dans une seule requête dépasserait la limite du serveur. Un appel
// qui tombe pendant qu'un autre onglet travaille revient immédiatement, sans rien
// produire : boucler ne double donc jamais le travail.
const ANALYSE_MAX_MS = 480000;
const ATTENTE_PLAN = '<div class="vide"><b>Nous préparons votre plan d’action.</b>'
  + '<p>Nous relisons votre fiche et en tirons les étapes de chaque mission, '
  + 'une mission après l’autre. Comptez deux à trois minutes — vous pouvez laisser '
  + 'cette page ouverte, elle se mettra à jour toute seule.</p></div>';
async function chargerAnalyse(force){
  const zone = document.getElementById("zoneanalyse");
  if (!zone || ANALYSE_ENCOURS) return;
  if (ANALYSE && !force) return;
  ANALYSE_ENCOURS = true;
  try {
    let d = await post({ action:"analysis", token:TOKEN });
    if (d.vide) { zone.innerHTML = '<div class="vide"><b>Rien à analyser pour l’instant.</b>'
        + '<p>Décrivez au moins une mission dans votre fiche.</p></div>'; ANALYSE = null; return; }
    if (d.pret && d.analysis) { ANALYSE = d; zone.innerHTML = planHtml(d.analysis, d.at, false); return; }
    zone.innerHTML = ATTENTE_PLAN;
    const t0 = Date.now();
    while (!d.pret && Date.now() - t0 < ANALYSE_MAX_MS) {
      d = await post({ action:"analysis", token:TOKEN, generer:true });
      if (d.pret) break;
      // Retour immédiat : une génération tourne ailleurs. On laisse passer un peu de
      // temps plutôt que de marteler le serveur.
      if (d.encours) await new Promise(r => setTimeout(r, 5000));
    }
    if (d.pret && d.analysis) { ANALYSE = d; zone.innerHTML = planHtml(d.analysis, d.at, false); return; }
    // Le plan précédent, affiché en attendant : il vaut mieux qu'un écran vide, et il
    // porte déjà sa mention « votre fiche a changé depuis cette analyse ».
    if (d.analysis) { ANALYSE = d; zone.innerHTML = planHtml(d.analysis, d.at, true); return; }
    throw new Error("indisponible");
  } catch(e) {
    zone.innerHTML = '<div class="vide"><b>Le plan d’action n’a pas pu être affiché.</b>'
      + '<p>' + esc(e.message) + '</p>'
      + '<p><button type="button" class="lien" id="reanalyse">Réessayer</button></p></div>';
    const b = document.getElementById("reanalyse");
    if (b) b.addEventListener("click", () => { ANALYSE = null; chargerAnalyse(true); });
  } finally { ANALYSE_ENCOURS = false; }
}

// ---------------------------------------------------------------- panneau : fiche
function panneauFiche(data){
  const prev = {};
  (data.answers || []).forEach(a => { prev[a.q] = a.a; });
  // Le formulaire public ne pose PAS la question « Votre société » : le nom est saisi
  // dans le champ d'identite et vit dans `clients.company`, pas dans les reponses. Sans
  // cette reprise, le prospect qui revenait sur son espace trouvait une question
  // obligatoire vide, une jauge a « 2 sur 3 », et surtout un enregistrement refuse tant
  // qu'il n'avait pas retape le nom que nous connaissons deja.
  if (!MODE_INSCRIPTION && !String(prev["Votre société"] || "").trim() && data.company) {
    prev["Votre société"] = data.company;
  }
  const draft = readDraft();
  let restaure = false;
  if (draft) {
    Object.keys(draft).forEach(q => { if ((prev[q] || "") !== draft[q]) { prev[q] = draft[q]; restaure = true; } });
  }

  let h = MODE_INSCRIPTION
    ? '<div class="secnote">Trois champs et une phrase suffisent pour réserver votre place. '
      + 'Vous recevrez aussitôt par email <b>votre lien personnel</b> : c’est là que vous compléterez '
      + 'le brief, tranquillement, et que vous suivrez l’avancement.</div>'
      // Identité du prospect. Ces trois champs n'existent que sur le formulaire public :
      // pour un client déjà créé, ils sont dans la fiche du tableau de bord et ne sont
      // pas à lui.
      + '<div class="q" id="qsoc"><label for="fsoc">Votre société<span class="req">obligatoire</span></label>'
      + '<div class="hint" id="hsoc">Le nom sous lequel nous vous suivrons.</div>'
      + '<input class="champ" id="fsoc" name="societe" type="text" autocomplete="organization" aria-describedby="hsoc" maxlength="120"></div>'
      + '<div class="q" id="qnom"><label for="fnom">Votre nom<span class="opt">facultatif</span></label>'
      + '<div class="hint" id="hnom">Pour savoir à qui nous nous adressons.</div>'
      + '<input class="champ" id="fnom" name="contact" type="text" autocomplete="name" aria-describedby="hnom" maxlength="120"></div>'
      + '<div class="q" id="qmail"><label for="fmail">Votre email professionnel<span class="req">obligatoire</span></label>'
      + '<div class="hint" id="hmail">C’est là que part votre lien personnel, et là que vous recevrez vos points d’avancement.</div>'
      + '<input class="champ" id="fmail" name="email" type="email" inputmode="email" autocomplete="email" aria-describedby="hmail" maxlength="160"></div>'
      // Piège à robots : masqué à l'écran ET au lecteur d'écran, hors du parcours clavier.
      // Un automate remplit tout ce qu'il trouve ; le serveur ignore l'envoi si c'est rempli.
      + '<div class="piege" aria-hidden="true"><label for="fsite">Ne remplissez pas ce champ</label>'
      + '<input id="fsite" name="site" type="text" tabindex="-1" autocomplete="off"></div>'
    : '<div class="secnote">Ces réponses servent à votre interlocuteur pour démarrer vite '
      + 'et dans la bonne direction. Trois questions sont obligatoires, les autres sont facultatives — '
      + 'vous pouvez revenir compléter plus tard avec ce même lien.</div>';
  if (data.answered_at) {
    h += '<div class="note">Fiche envoyée le ' + esc(dateCourte(data.answered_at)) + '. Vous pouvez la modifier et la renvoyer.</div>';
  }
  if (restaure) {
    h += '<div class="note">Nous avons retrouvé une saisie non envoyée sur cet appareil : elle est réaffichée '
       + 'ci-dessous. Pensez à enregistrer pour nous la transmettre.</div>';
  }
  // Après l'état de la fiche, avant le cadre : le client sait d'abord où il en est, et
  // seulement ensuite ce qu'il lui reste à lire.
  h += '<div class="avance" id="avance"><span class="jauge" aria-hidden="true"><i id="jauge"></i></span>'
     + '<span id="avancetxt" role="status"></span></div>';
  // Une question, son libelle et sa zone de saisie. Extrait pour etre pose au meme
  // endroit qu'on l'affiche a plat ou dans un repli : deux versions du meme HTML
  // auraient divergé au premier ajout de question.
  const champQ = (it, i) =>
    '<div class="q" id="q' + i + '"><label for="f' + i + '">' + esc(it.q)
    + (estRequis(it) ? '<span class="req">obligatoire</span>' : '<span class="opt">facultatif</span>') + '</label>'
    + '<div class="hint" id="h' + i + '">' + esc(hintDe(it)) + '</div>'
    + '<textarea id="f' + i + '" name="q' + i + '" aria-describedby="h' + i + '" autocomplete="off" rows="3">'
    + esc(prev[it.q] || "") + '</textarea></div>';

  const blocCadre = '<div class="cadre"><ul>'
    + CADRE.map(c => '<li><b>' + esc(c[0]) + '.</b> ' + esc(c[1]) + '</li>').join('')
    + '</ul></div>';

  if (MODE_INSCRIPTION) {
    // 1. Ce qui bloque la reservation, a plat.
    QUESTIONS.forEach((it, i) => { if (estRequis(it) && questionAffichee(it)) h += champQ(it, i); });

    // 2. Le reste du brief, replie. Rien n'est perdu pour celui qui veut tout dire
    //    maintenant ; rien n'est impose a celui qui veut juste reserver.
    let inner = "", sec2 = "";
    QUESTIONS.forEach((it, i) => {
      if (estRequis(it) || !questionAffichee(it)) return;
      if (it.s !== sec2) {
        sec2 = it.s;
        inner += '<h2 class="sec">' + esc(sec2) + '</h2>';
        if (SECTION_NOTES[sec2]) inner += '<div class="secnote">' + SECTION_NOTES[sec2] + '</div>';
      }
      inner += champQ(it, i);
    });
    h += '<details class="repli"><summary>Compléter le brief maintenant '
       + '<span class="compl">facultatif, environ 5 minutes</span></summary>'
       + '<div class="dedans"><div class="secnote" style="margin-top:14px">Rien n’est obligatoire ici. '
       + 'Plus vous en dites, plus votre interlocuteur démarre dans la bonne direction — mais vous pourrez '
       + 'aussi tout compléter plus tard depuis votre lien personnel.</div>' + inner + '</div></details>';

    // 3. Le cadre d'intervention, replie lui aussi mais juste au-dessus de la case :
    //    on ne le cache pas, on arrete de l'imposer avant meme d'avoir dit bonjour.
    h += '<details class="repli" id="repli-cadre"><summary>Le cadre de nos interventions '
       + '<span class="compl">à lire avant d’accepter</span></summary>'
       + '<div class="dedans">' + blocCadre + '</div></details>';
  } else {
    h += '<h2 class="sec">Le cadre de nos interventions</h2>'
       + '<div class="secnote">À lire avant de décrire vos missions. Ce cadre protège votre activité autant que la nôtre.</div>'
       + blocCadre;

    let sec = "";
    QUESTIONS.forEach((it, i) => {
      if (it.s !== sec) {
        sec = it.s;
        h += '<h2 class="sec">' + esc(sec) + '</h2>';
        if (SECTION_NOTES[sec]) h += '<div class="secnote">' + SECTION_NOTES[sec] + '</div>';
      }
      h += champQ(it, i);
    });
  }
  h += '<div class="q accept" id="qaccept"><label for="accept">'
     + '<input type="checkbox" id="accept"' + (data.terms_accepted_at ? ' checked' : '') + '> '
     + '<b>J’ai lu et j’accepte le cadre d’intervention</b> décrit ' + (MODE_INSCRIPTION ? 'ci-dessus' : 'en haut de cet onglet') + '.'
     + '<span class="req">obligatoire</span></label>'
     + (data.terms_accepted_at ? '<div class="hint" style="margin:8px 0 0">Accepté le '
         + esc(dateCourte(data.terms_accepted_at)) + '.</div>' : '')
     + '</div>';
  h += '<div class="bar"><button type="button" class="principal" id="go">'
     + (MODE_INSCRIPTION ? 'Réserver ma place' : 'Enregistrer ma fiche') + '</button>'
     + '<span class="msg" id="msg" aria-live="polite"></span></div>';
  return h;
}

// ---------------------------------------------------------------- inscription
// Le formulaire public réutilise EXACTEMENT le panneau de la fiche : mêmes questions,
// même cadre d'intervention, mêmes couleurs, même jauge. Une seconde page aurait fait
// deux questionnaires à maintenir, et ils auraient divergé au premier ajout de question.
function renderInscription(){
  DATA = { answers: [], files: [] };
  document.getElementById("wrap").innerHTML =
    '<header><div class="kicker" translate="no">Claude Agency</div>'
    + '<h1>Réservez votre place</h1>'
    + '<p class="sub">Deux minutes suffisent pour réserver. Le reste peut attendre.</p></header>'
    + '<main data-canal="3"><section id="p-fiche">' + panneauFiche(DATA) + '</section></main>';

  document.getElementById("go").addEventListener("click", save);
  QUESTIONS.forEach((it, i) => { const el = document.getElementById("f" + i);
    if (el) el.addEventListener("input", () => { writeDraft(); majAvancement(); }); });
  // La société et l'email comptent dans la jauge : sans ces deux écouteurs, elle reste
  // à zéro pendant que le prospect remplit les deux premiers champs de la page.
  ["fsoc", "fmail"].forEach((id) => document.getElementById(id).addEventListener("input", majAvancement));
  brancherCadre();
  majAvancement();
}

// Le cadre d’intervention est replié sur le formulaire public : on ne l’impose pas à
// quelqu’un qui n’a pas encore dit bonjour. Mais accepter un texte qu’on n’a jamais
// affiché ne prouve rien — et c’est précisément cette acceptation dont la date part en
// base (`terms_accepted_at`). Le premier clic sur la case déroule donc le cadre et amène
// le regard dessus SANS cocher ; le second coche, une fois le texte à l’écran. Un seul
// clic de plus, et seulement pour qui n’avait pas ouvert le repli de lui-même.
function brancherCadre(){
  const cb = document.getElementById("accept");
  const repli = document.getElementById("repli-cadre");
  if (!cb || !repli) return;
  cb.addEventListener("click", (e) => {
    if (repli.open || cb.dataset.vu === "1") return;
    e.preventDefault();
    repli.open = true;
    cb.dataset.vu = "1";
    const m = document.getElementById("msg");
    if (m) { m.className = "msg"; m.textContent = "Le cadre s’affiche ci-dessus. Parcourez-le, puis cochez la case."; }
    repli.scrollIntoView({ behavior:"smooth", block:"start" });
  });
  // Ouvert à la main : le texte est à l’écran, la case n’a plus à être défendue.
  repli.addEventListener("toggle", () => { if (repli.open) cb.dataset.vu = "1"; });
}

// ---------------------------------------------------------------- rendu
function render(data){
  DATA = data;

  let h = '<header><div class="kicker" translate="no">Claude Agency</div>'
        + '<h1>' + esc(data.company || "Votre espace") + '</h1>'
        + '<p class="sub">Cette page vous est réservée : seul votre lien personnel y donne accès.</p>'
        + reperes(data)
        + '</header>';
  h += barreOnglets(data);
  h += '<main>'
     + '<section role="tabpanel" data-canal="2" id="p-livrables"  aria-labelledby="t-livrables"  tabindex="0" hidden>' + panneauLivrables(data) + '</section>'
     + '<section role="tabpanel" data-canal="3" id="p-fiche"      aria-labelledby="t-fiche"      tabindex="0" hidden>' + panneauFiche(data) + '</section>'
     + '<section role="tabpanel" data-canal="4" id="p-analyse"    aria-labelledby="t-analyse"    tabindex="0" hidden>' + panneauAnalyse(data) + '</section>'
     + '</main>';

  document.getElementById("wrap").innerHTML = h;

  ONGLETS.forEach(o => {
    const b = document.getElementById("t-" + o.id);
    b.addEventListener("click", () => setOnglet(o.id, false));
    b.addEventListener("keydown", clavierOnglets);
  });
  document.getElementById("go").addEventListener("click", save);
  QUESTIONS.forEach((it, i) => { const el = document.getElementById("f" + i);
    if (el) el.addEventListener("input", () => { writeDraft(); majAvancement(); }); });
  majAvancement();
  brancherLiensOnglets();
  brancherTelechargements();
  brancherAudits();
  brancherEnvois();
  brancherEtats();

  setOnglet(ongletParDefaut(), false);
}

// La réponse de « download » est le fichier lui-même, pas du JSON : on n’utilise donc
// pas post(). Le jeton part dans le corps de la requête, jamais dans l’URL.
function brancherTelechargements(){
  document.querySelectorAll(".dl").forEach(btn => {
    btn.addEventListener("click", async () => {
      const m = document.getElementById("dlmsg");
      // .txt et non .nom : .nom porte aussi la flèche, et ce nom est comparé au fichier
      // par le serveur — le lui envoyer avec un « ↓ » collé devant ferait refuser tous
      // les téléchargements (409).
      // Sur une ligne de version, .txt porte la date, pas le nom du fichier : c'est
      // data-nom qui fait foi, et lui seul passe le contrôle du serveur.
      const nom = btn.dataset.nom || btn.querySelector(".txt").textContent;
      const ref = btn.dataset.ref || "";
      btn.disabled = true;
      if (m) { m.className = "msg"; m.textContent = "Téléchargement de " + nom + "…"; }
      try {
        const r = await fetch(FN, { method:"POST", headers:{"Content-Type":"application/json"},
          // Le nom part avec l'indice : le serveur refuse si la liste a bouge entre
          // l'affichage de la page et le clic, plutot que de servir un autre fichier.
          body: JSON.stringify({ action:"download", token:TOKEN, i:Number(btn.dataset.i), file:nom, ref:ref || undefined }) });
        if (!r.ok) {
          let d = null; try { d = await r.json(); } catch(e) {}
          throw new Error((d && d.error) || "indisponible");
        }
        const u = URL.createObjectURL(await r.blob());
        const a = document.createElement("a");
        // Une version ancienne emporte l'empreinte dans son nom, comme le fait le
        // serveur : sans elle, elle écraserait la version à jour dans le dossier de
        // téléchargements, sous le même nom et sans prévenir.
        const p = nom.lastIndexOf(".");
        a.href = u;
        a.download = !ref ? nom
          : p > 0 ? nom.slice(0, p) + "-" + ref.slice(0, 7) + nom.slice(p)
                  : nom + "-" + ref.slice(0, 7);
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(u), 10000);
        if (m) m.textContent = "";
      } catch(e) {
        if (m) { m.className = "msg err"; m.textContent = "Ce fichier n’a pas pu être téléchargé (" + e.message + "). Réessayez, ou signalez-le à votre interlocuteur."; }
      }
      btn.disabled = false;
    });
  });
}

async function save(){
  const btn = document.getElementById("go"), m = document.getElementById("msg");
  // Un champ absent du DOM (question retiree du formulaire public) vaut reponse vide :
  // l'index reste aligne sur QUESTIONS, et le serveur accepte les fiches partielles.
  const answers = QUESTIONS.map((it, i) => { const el = document.getElementById("f" + i);
    return { q: it.q, a: el ? el.value.trim() : "" }; });

  // Identité, sur le formulaire public uniquement. Vérifiée ici pour que le prospect
  // corrige sur place ; le serveur revérifie de toute façon — une page peut être modifiée.
  if (MODE_INSCRIPTION) {
    const soc = document.getElementById("fsoc"), mail = document.getElementById("fmail");
    const mauvais = [];
    if (!soc.value.trim()) mauvais.push(["qsoc", soc, "Indiquez le nom de votre société."]);
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim())) mauvais.push(["qmail", mail, "Cette adresse email n’est pas valide."]);
    document.getElementById("qsoc").classList.toggle("miss", !soc.value.trim());
    document.getElementById("qmail").classList.toggle("miss", !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim()));
    if (mauvais.length) {
      m.className = "msg err";
      m.textContent = mauvais[0][2];
      mauvais[0][1].focus();
      document.getElementById(mauvais[0][0]).scrollIntoView({ behavior:"smooth", block:"center" });
      return;
    }
  }
  // Les 3 questions obligatoires sont verifiees ici, avant l’envoi : le serveur accepte
  // les fiches partielles a dessein (le client peut enregistrer, revenir, completer).
  const manque = QUESTIONS.map((it, i) => (estRequis(it) && !answers[i].a) ? i : -1).filter((i) => i >= 0);
  QUESTIONS.forEach((it, i) => { const bloc = document.getElementById("q" + i);
    if (bloc) bloc.classList.toggle("miss", manque.includes(i)); });
  if (manque.length) {
    m.className = "msg err";
    m.textContent = manque.length === 1
      ? "Une question obligatoire est encore vide : complétez-la puis réessayez."
      : manque.length + " questions obligatoires sont encore vides : complétez-les puis réessayez.";
    // Une question obligatoire peut vivre dans un repli : le focus sur un champ ferme
    // ne montre rien. On ouvre le repli avant de deplacer le regard.
    const cible = document.getElementById("q" + manque[0]);
    const repli = cible && cible.closest ? cible.closest("details") : null;
    if (repli) repli.open = true;
    document.getElementById("f" + manque[0]).focus();
    cible.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  const accepte = document.getElementById("accept").checked;
  document.getElementById("qaccept").classList.toggle("miss", !accepte);
  if (!accepte) {
    m.className = "msg err";
    m.textContent = "Cochez la case d’acceptation du cadre d’intervention pour envoyer votre fiche.";
    document.getElementById("accept").focus();
    document.getElementById("qaccept").scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  btn.disabled = true; m.className = "msg";
  m.textContent = MODE_INSCRIPTION ? "Envoi…" : "Enregistrement…";
  try {
    if (MODE_INSCRIPTION) {
      const d = await post({ action:"signup", answers, terms_accepted:true,
        company: document.getElementById("fsoc").value.trim(),
        contact_name: document.getElementById("fnom").value.trim(),
        contact_email: document.getElementById("fmail").value.trim(),
        site: document.getElementById("fsite").value });
      clearDraft();
      confirmationInscription(d);
      return;
    }
    await post({ action:"submit", token:TOKEN, answers, terms_accepted:true });
    clearDraft(); // le serveur a la version definitive : le brouillon n’a plus de raison d’etre
    DATA = Object.assign({}, DATA || {}, { answers: answers, answered_at: new Date().toISOString(),
      terms_accepted_at: DATA && DATA.terms_accepted_at ? DATA.terms_accepted_at : new Date().toISOString() });
    confirmation();
    return;
  } catch(e) {
    m.className = "msg err";
    m.textContent = (MODE_INSCRIPTION ? "L’envoi a échoué (" : "L’enregistrement a échoué (") + e.message
      + "). Vos réponses sont toujours à l’écran : réessayez dans un instant.";
  }
  btn.disabled = false;
}

// Confirmation d'inscription. Elle dit ce qui se passe MAINTENANT, parce que c'est la
// seule chose que le prospect ne peut pas deviner : son lien part par email, et c'est
// la seule porte vers son espace. `mailed` vient du verdict Mailjet, pas d'un code 200 :
// promettre un email qui n'est jamais parti est la pire façon de commencer.
function confirmationInscription(d){
  const existant = d && d.existant;
  const parti = !d || d.mailed !== false;
  document.getElementById("wrap").innerHTML =
    '<main data-canal="2"><div class="fait"><div class="tick" aria-hidden="true">✓</div>'
    + '<h2>' + (existant ? 'Vous êtes déjà suivi par Claude Agency.' : 'Merci, votre demande est enregistrée.') + '</h2>'
    + (parti
        ? '<p>Nous venons de vous envoyer <b>votre lien personnel</b> par email. Gardez-le : c’est par '
          + 'lui que vous téléchargerez vos livrables et que vous suivrez le plan d’action '
          + 'établi pour vos challenges.</p>'
          + '<p class="petit">Si vous ne le voyez pas d’ici quelques minutes, regardez dans vos courriers '
          + 'indésirables avant de nous écrire.</p>'
        : '<p>Votre demande est bien enregistrée, mais <b>l’email contenant votre lien personnel n’a pas pu '
          + 'partir</b>. Écrivez-nous à <a href="mailto:' + CONTACT + '">' + CONTACT + '</a> et nous vous '
          + 'le transmettrons directement.</p>')
    + (existant ? '' : '<p class="petit">Un membre de l’équipe revient vers vous avec un plan d’action adapté '
        + 'à ce que vous venez de décrire.</p>')
    + '</div></main>';
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// La confirmation remplace le contenu de l’onglet, pas la page : les onglets restent
// accessibles, et le client peut enchaîner sur son avancement sans recharger.
function confirmation(){
  const p = document.getElementById("p-fiche");
  p.innerHTML = '<div class="fait"><div class="tick" aria-hidden="true">✓</div>'
    + '<h2>Merci, votre fiche est enregistrée.</h2>'
    + '<p>Un membre de l’équipe Claude Agency va revenir vers vous dans les meilleurs délais '
    + 'pour vous proposer un plan d’action adapté aux objectifs et aux contraintes que vous venez de décrire.</p>'
    + '<p class="petit">Ce lien reste valable : revenez quand vous le souhaitez pour compléter vos réponses '
    + 'ou télécharger vos livrables.</p>'
    + '<p><button type="button" class="lien" id="revoir">Revoir mes réponses</button></p></div>';
  p.scrollIntoView({ behavior:"smooth", block:"start" });
  document.getElementById("revoir").addEventListener("click", () => { render(DATA); setOnglet("fiche", true); });
}

(async () => {
  if (MODE_INSCRIPTION) { renderInscription(); return; }
  if (!TOKEN) {
    document.getElementById("wrap").innerHTML =
      '<div class="center">Ce lien est incomplet.<br>Ouvrez le lien exact reçu par email, '
      + 'ou écrivez à <a href="mailto:' + CONTACT + '">' + CONTACT + '</a>.</div>';
    return;
  }
  try {
    render(await post({ action:"form", token:TOKEN }));
  } catch(e) {
    document.getElementById("wrap").innerHTML =
      '<div class="center">Ce lien n’est plus valide.<br>Écrivez à '
      + '<a href="mailto:' + CONTACT + '">' + CONTACT + '</a> pour en recevoir un nouveau.</div>';
  }
})();
</script>
