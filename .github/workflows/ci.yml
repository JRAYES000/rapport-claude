name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

jobs:
  # Filet de sécurité : le code compile-t-il ? (attrape les erreurs de syntaxe avant un build cassé)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Vérifier la syntaxe Python
        run: python -m py_compile bilan_hebdo.py
      - name: Vérifier que version.json et changelog.json sont du JSON valide
        run: |
          python -c "import json;json.load(open('web/version.json',encoding='utf-8'))"
          python -c "import json,os;p='web/changelog.json';json.load(open(p,encoding='utf-8')) if os.path.exists(p) else None"

  # Les pages web ne sont compilées par personne : tout leur JavaScript est inline, et
  # une parenthèse oubliée ne se voit qu'à l'ouverture de la page — donc en production.
  # Ces tests existaient depuis le 29/07 mais ne tournaient qu'à la main, c'est-à-dire
  # quand on y pensait, c'est-à-dire jamais après une correction pressée.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Bloquant : une régression d'échappement est une faille, pas un détail de goût.
      - name: Échappement HTML des deux pages
        run: node tools/test-echappement.js
      # Bloquant : du JS qui ne parse pas casse la page en entier.
      - name: Syntaxe du JavaScript inline
        run: node tools/test-syntaxe-js.js
      # Bloquant : une ligne de version qui perd son data-nom fait refuser tous les
      # téléchargements d'anciennes versions (409), et rien ne le dit à l'écran.
      - name: Versions précédentes d'un livrable
        run: node tools/test-versions.js
      # Bloquant : ce prompt part au presse-papiers puis dans Claude. Un chemin de dépôt
      # faux n'échoue pas — il fait analyser le dossier d'un autre client, en silence.
      - name: Prompt de vérification d'un challenge
        run: node tools/test-prompt-verif.js
      # Bloquant : « Aucune activité » et « Run interrompu » disent le contraire l'un de
      # l'autre. Se tromper de badge, c'est affirmer que tout va bien sur un poste qui
      # vient de perdre une journée de travail (20/08/2026).
      - name: Badge « Run interrompu »
        run: node tools/test-run-interrompu.js
      # NON bloquant, décision du 02/08/2026 : le contraste est un jugement de design.
      # Le rendre bloquant, c'est empêcher un correctif urgent de partir parce qu'un gris
      # est à 4,3 pour 1. L'avertissement remonte dans le résumé du build, il ne disparaît
      # pas — il n'arrête simplement pas la file.
      - name: Contraste des couleurs (avertissement seulement)
        run: node tools/test-contraste.js || echo "::warning::test-contraste.js a échoué — à regarder, mais n'arrête pas la CI"

  # À chaque Release publiée : vérifier que le ZIP est bien attaché et que la version colle au tag.
  release-check:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Le ZIP est-il attaché à la Release ?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "Assets : $assets"
          echo "$assets" | grep -q "RapportClaudeSetup.zip" || { echo "::error::ZIP manquant sur la Release $tag"; exit 1; }
      - name: version.json correspond-il au tag ?
        run: |
          tag="${{ github.event.release.tag_name }}"; ver="${tag#v}"
          got=$(python -c "import json;print(json.load(open('web/version.json',encoding='utf-8'))['version'])")
          echo "tag=$ver version.json=$got"
          [ "$ver" = "$got" ] || echo "::warning::version.json ($got) ≠ tag ($ver) — pense à lancer publish.ps1"
